iven analysis dan model logis", "Membuat diagram dekomposisi dan diagram konteks", "Menggambar DFD dengan simbol dan aturan yang benar", "Membedakan DFD dari flowchart", "Mengenali aliran data yang ilegal dan memperbaikinya", "Merinci DFD bertingkat (level 0, 1, 2, 3) dengan balancing yang benar"], "blocks": [{"t": "h", "x": "Mengapa memodelkan"}, {"t": "p", "x": "**Model-driven analysis** menekankan penggambaran model sistem untuk mendokumentasikan dan memvalidasi sistem yang ada maupun yang diusulkan. Model adalah representasi realitas atau visi, dan pada akhirnya menjadi cetak biru perancangan sistem."}, {"t": "table", "head": ["Pendekatan", "Pusat perhatian", "Isi model"], "rows": [["Structured Analysis (SADT)", "Proses", "Proses beserta masukan, keluaran, dan berkasnya"], ["Information Engineering (IE)", "Data (tetapi peka proses)", "Data dan proses yang disinkronkan"], ["Object-Oriented Analysis (OOA)", "Objek", "Data dan proses digabung dalam objek, dilihat dari struktur dan perilaku"]], "w": [2.2, 2.0, 2.7]}, {"t": "p", "x": "**Model logis** (konseptual) menggambarkan **apa** yang dilakukan sistem, bukan bagaimana sistem diimplementasikan. Jenisnya: model proses (DFD), model data (ERD), model antarmuka (diagram konteks), dan model objek (UML)."}, {"t": "box", "kind": "contoh", "title": "Logis dan fisik", "x": ["Logis: \"Catat pesanan pelanggan\". Fisik: \"Kasir mengetik pesanan di tablet Android lalu data tersimpan di MySQL\". DFD logis tidak menyebut tablet, MySQL, atau nama orang."]}, {"t": "h", "x": "Dekomposisi dan diagram konteks"}, {"t": "p", "x": "Proses adalah pekerjaan yang dilakukan terhadap, atau sebagai respons atas, aliran data masuk. Sistem sendiri adalah sebuah proses: menerima masukan, menghasilkan keluaran, dengan umpan balik, di dalam lingkungan yang terus berubah."}, {"t": "ul", "x": ["**Dekomposisi**: memecah sistem menjadi subsistem, proses, dan subproses. Tiap tingkat menunjukkan rincian yang lebih banyak atau lebih sedikit.", "**Diagram dekomposisi** (hierarchy chart): menunjukkan pemecahan fungsional dari atas ke bawah.", "**Diagram konteks**: mendefinisikan lingkup dan batas sistem. Satu proses di tengah, dikelilingi entitas eksternal."]}, {"t": "img", "f": "s6_p10.jpg", "cap": "Slide kuliah hlm. 10: diagram dekomposisi"}, {"t": "img", "f": "s6_p11.jpg", "cap": "Slide kuliah hlm. 11: contoh diagram konteks (Dennis, Wixom, Roth, 2012)"}, {"t": "box", "kind": "langkah", "title": "Membuat diagram konteks", "x": ["Tentukan nama sistem; gambar satu proses di tengah dengan nomor 0.", "Daftar semua pihak luar yang memberi atau menerima data.", "Untuk tiap pihak, gambar aliran masuk dan aliran keluar.", "Beri nama tiap aliran dengan kata benda.", "Periksa: tidak ada data store dan tidak ada aliran antarpihak luar."]}, {"t": "box", "kind": "aturan", "title": "Aturan diagram konteks", "x": ["Hanya ada satu proses.", "Tidak menampilkan data store.", "Entitas eksternal tidak saling terhubung langsung.", "Yang digambar hanya hal yang melewati batas sistem."]}, {"t": "h", "x": "Data Flow Diagram"}, {"t": "p", "x": "DFD menggambarkan aliran data melalui sistem dan pekerjaan yang dilakukan sistem. \"Sistem\" di sini bisa berupa organisasi, perusahaan, hardware, atau software. DFD juga populer untuk Business Process Redesign."}, {"t": "img", "f": "d6_simbol_dfd.png", "cap": "Diagram rangkuman: empat simbol DFD"}, {"t": "img", "f": "s6_p16.jpg", "cap": "Slide kuliah hlm. 16: penjelasan simbol pada contoh ATM"}, {"t": "p", "x": "Aturan DFD dari slide:"}, {"t": "ul", "x": ["Semua nama harus unik.", "**Bukan flowchart**: tidak menyiratkan urutan.", "Tidak ada keputusan logis (tidak ada belah ketupat ya/tidak).", "Jangan terjebak dalam detail.", "**Leveling (balancing)**: jumlah masukan dan keluaran dijaga sama antara proses induk dan diagram anaknya."]}, {"t": "img", "f": "s6_p14.jpg", "cap": "Slide kuliah hlm. 14: aturan DFD dan prinsip leveling"}, {"t": "table", "head": ["DFD", "Flowchart"], "rows": [["Proses bisa berjalan paralel", "Proses dieksekusi satu per satu"], ["Menunjukkan aliran data", "Menunjukkan aliran kendali (urutan dan perpindahan kendali)"], ["Waktu tiap proses bisa sangat berbeda (harian, bulanan)", "Bagian dari satu program dengan waktu yang konsisten"]], "w": [3.4, 3.5]}, {"t": "p", "x": "**Aliran data ilegal**: data tidak boleh mengalir langsung antara dua entitas eksternal, antara entitas dan data store, atau antara dua data store. Selalu harus ada proses di antaranya."}, {"t": "img", "f": "d6_aliran_ilegal.png", "cap": "Diagram rangkuman: tiga aliran yang salah dan perbaikannya"}, {"t": "img", "f": "s6_p20.jpg", "cap": "Slide kuliah hlm. 20: aliran data ilegal"}, {"t": "p", "x": "**Kamus data** melengkapi DFD. Isinya: nama item, alias, deskripsi atau tujuan, item data terkait, rentang nilai, aliran data, dan definisi struktur data."}, {"t": "box", "kind": "contoh", "title": "Satu entri kamus data", "x": ["Nama: no_pesanan. Alias: order ID. Deskripsi: nomor unik tiap pesanan online. Format: PO + 8 digit. Dipakai pada aliran: pesanan, konfirmasi, alert kirim. Disimpan di: D2 Penjualan & Pesanan."]}, {"t": "img", "f": "s6_p17.jpg", "cap": "Slide kuliah hlm. 17: DFD parsial aplikasi ATM"}, {"t": "box", "kind": "langkah", "title": "Membuat DFD level 0", "x": ["Ambil fungsi utama dari diagram dekomposisi; jadikan proses bernomor 1, 2, 3, dan seterusnya.", "Salin semua entitas eksternal dan aliran dari diagram konteks.", "Sambungkan tiap aliran ke proses yang menanganinya.", "Tambahkan data store untuk data yang perlu disimpan dan dipakai lagi.", "Tambahkan aliran antarproses bila satu proses memakai hasil proses lain.", "Periksa balancing terhadap diagram konteks.", "Rapikan: kurangi garis bersilangan, gandakan simbol bila perlu."]}, {"t": "box", "kind": "aturan", "title": "Aturan DFD", "x": ["Proses: nama kata kerja + objek, punya minimal satu masukan dan satu keluaran.", "Aliran data: nama kata benda, satu arah; aliran dua arah digambar sebagai dua panah.", "Data store: nama kata benda; hanya terhubung ke proses.", "Entitas eksternal: hanya terhubung ke proses.", "Tidak ada urutan, percabangan, atau perulangan.", "Nomor anak mengikuti induk: proses 1 dirinci menjadi 1.1, 1.2, dan seterusnya."]}, {"t": "box", "kind": "tips", "title": "Tips", "x": ["Mulai dari keluaran: tanyakan laporan atau dokumen apa yang harus dihasilkan, lalu telusuri mundur datanya dari mana.", "Bila satu diagram berisi lebih dari 7 proses, gabungkan beberapa dan rinci di level berikutnya."]}, {"t": "h", "x": "Pembahasan latihan: retail fashion"}, {"t": "p", "x": "**Soal (Modul 6).** Bisnis retail fashion menjual online dan offline, punya beberapa toko di Jakarta dan Bandung. SI yang dibangun mendukung penjualan, pengelolaan stok, pengadaan dari supplier sampai barang diterima di gudang toko, serta pelaporan kinerja dan keuangan kepada pemilik dan manajer toko. Laporan penjualan berkala dikirim ke kantor pajak. Satu purchase order bisa dikirim dalam beberapa delivery order. Stok dicatat per kode barang per toko. Penjualan offline mencatat toko, tanggal, barang, total, jenis dan nomor kartu. Penjualan online lewat website menampilkan katalog dan stok gabungan; setelah pelanggan membayar, customer service online menentukan toko mana yang mengirim tiap barang, sistem memberi alert ke admin toko, dan petugas toko mencatat tanggal kirim."}, {"t": "p", "x": "**Langkah 1: temukan entitas eksternal.** Garis bawahi kata benda yang memberi atau menerima data tetapi berada di luar sistem: pelanggan, supplier, pemilik dan manajer toko, kantor pajak, CS online, staf toko."}, {"t": "p", "x": "**Langkah 2: temukan fungsi utama.** Soal menyebut empat: penjualan, pengelolaan stok, pengadaan, pelaporan. Ini menjadi tingkat pertama diagram dekomposisi."}, {"t": "img", "f": "d6_dekomposisi_retail.png", "cap": "Diagram rangkuman: diagram dekomposisi SI retail fashion"}, {"t": "p", "x": "**Langkah 3: diagram konteks.** Satu proses (sistem) dan semua aliran data dari dan ke entitas eksternal."}, {"t": "img", "f": "d6_konteks_retail.png", "cap": "Diagram rangkuman: diagram konteks SI retail fashion"}, {"t": "p", "x": "**Langkah 4: DFD level 0.** Pecah proses tunggal menjadi empat proses, tambahkan data store, dan pastikan semua aliran pada diagram konteks muncul lagi (balancing)."}, {"t": "img", "f": "d6_dfd0_retail.png", "cap": "Diagram rangkuman: DFD level 0 SI retail fashion"}, {"t": "table", "head": ["Proses", "Masukan", "Keluaran", "Data store"], "rows": [["1 Penjualan", "Pesanan, data diri, pembayaran, toko pengirim, penjualan offline, tanggal kirim, harga, stok tersedia", "Katalog, info stok, konfirmasi, pesanan terbayar, alert kirim, barang terjual", "D1, D2, D3, D4 (baca)"], ["2 Pengelolaan Stok", "Barang terjual, barang diterima, kode barang", "Stok tersedia, kebutuhan restock", "D5, D4 (baca)"], ["3 Pengadaan", "Kebutuhan restock, delivery order, data supplier", "Purchase order, barang diterima", "D6, D7, D8 (baca)"], ["4 Pelaporan", "Data penjualan, posisi stok, nilai pembelian", "Laporan kinerja dan keuangan, laporan penjualan berkala", "D2, D5, D6 (baca)"]], "w": [1.4, 2.4, 1.9, 1.2]}, {"t": "h", "x": "Contoh berjenjang: DFD level 1, 2, dan 3"}, {"t": "p", "x": "Soal latihan hanya meminta sampai DFD. Agar terlihat cara **merinci bertingkat**, berikut kelanjutannya untuk satu cabang. Urutannya: diagram konteks, level 0, level 1, level 2, level 3. Sebagian buku menyebut diagram konteks sebagai level 0 sehingga semua nomor bergeser satu; tanyakan konvensi yang dipakai dosen."}, {"t": "table", "head": ["Diagram", "Yang dirinci", "Isi", "Nomor proses"], "rows": [["Konteks", "Seluruh sistem", "1 proses, 6 entitas eksternal", "0"], ["Level 0", "Proses 0", "4 proses utama dan 8 data store", "1, 2, 3, 4"], ["Level 1", "Proses 1 Penjualan", "4 subproses", "1.1 sampai 1.4"], ["Level 2", "Proses 1.2 Terima pesanan online", "4 subproses", "1.2.1 sampai 1.2.4"], ["Level 3", "Proses 1.2.3 Proses pembayaran", "3 proses primitif", "1.2.3.1 sampai 1.2.3.3"]], "w": [1.1, 2.4, 2.3, 1.6]}, {"t": "p", "x": "**Level 1: proses 1 Penjualan.** Empat subprosesnya sama dengan cabang 1 pada diagram dekomposisi. Periksa balancing: semua aliran yang menyentuh proses 1 di level 0 (pesanan dan pembayaran, katalog dan konfirmasi, toko pengirim, pesanan terbayar, penjualan offline, tanggal kirim, alert kirim, barang terjual, stok tersedia, serta aliran ke D1, D2, D3 dan dari D4) muncul lagi di sini, tidak kurang dan tidak lebih."}, {"t": "img", "f": "d6_dfd1_penjualan.png", "cap": "Diagram rangkuman: DFD level 1 untuk proses 1 Penjualan"}, {"t": "p", "x": "**Level 2: proses 1.2 Terima pesanan online.** Masukan dan keluaran 1.2 di level 1 dibagi ke empat langkah: menampilkan katalog dan stok, mencatat pesanan, memproses pembayaran, dan mengonfirmasi. Aliran antarsubproses (rincian pesanan, status bayar lunas) adalah aliran baru yang sah karena terjadi di dalam proses induk."}, {"t": "img", "f": "d6_dfd2_pesanan_online.png", "cap": "Diagram rangkuman: DFD level 2 untuk proses 1.2"}, {"t": "p", "x": "**Level 3: proses 1.2.3 Proses pembayaran.** Induknya hanya punya dua masukan (rincian pesanan, pembayaran) dan satu keluaran (status bayar lunas), dan ketiganya tetap ada. Tiap proses di sini sudah cukup sederhana untuk ditulis sebagai beberapa kalimat atau pseudocode, jadi perincian berhenti."}, {"t": "img", "f": "d6_dfd3_pembayaran.png", "cap": "Diagram rangkuman: DFD level 3 untuk proses 1.2.3"}, {"t": "box", "kind": "contoh", "title": "Cara cepat memeriksa balancing", "x": ["Tutup bagian dalam diagram anak dengan tangan, sisakan hanya panah yang keluar-masuk tepi gambar. Panah-panah itu harus sama persis dengan panah yang menempel pada proses induk di diagram satu tingkat di atasnya. Contoh: level 3 menyisakan tiga panah (rincian pesanan, pembayaran, status bayar lunas), sama dengan yang menempel pada 1.2.3 di level 2."]}, {"t": "box", "kind": "tips", "title": "Kapan berhenti merinci", "x": ["Tidak semua proses harus sampai level 3. Rinci hanya proses yang masih rumit. Pegangan praktis: satu diagram berisi sekitar 3 sampai 7 proses, dan proses disebut primitif bila logikanya muat dalam setengah halaman penjelasan. Proses 4 Pelaporan, misalnya, cukup dirinci sampai level 1."]}, {"t": "box", "kind": "awas", "title": "Catatan jawaban", "x": ["Ini salah satu alternatif jawaban, bukan kunci resmi. Jawaban lain sah selama: semua kebutuhan di soal tercakup, tidak ada aliran ilegal, tiap proses punya masukan dan keluaran, dan diagram seimbang dengan diagram konteks. Staf toko dan CS online di sini diperlakukan sebagai entitas eksternal karena mereka memberi masukan ke sistem; sebagian dosen menganggap mereka bagian internal, jadi ikuti konvensi kelas."]}, {"t": "box", "kind": "aturan", "title": "Daftar periksa sebelum mengumpulkan DFD", "x": ["Tiap proses bernama kata kerja + objek.", "Tiap aliran data diberi nama kata benda.", "Tidak ada proses tanpa masukan (miracle) atau tanpa keluaran (black hole).", "Tidak ada aliran entitas ke entitas, entitas ke store, atau store ke store.", "Aliran di level 0 cocok dengan diagram konteks; tiap level cocok dengan induknya.", "Tidak ada simbol keputusan atau urutan langkah seperti flowchart."]}, {"t": "box", "kind": "langkah", "title": "Merinci satu proses ke level berikutnya", "x": ["Pilih proses yang masih terlalu rumit.", "Catat semua aliran yang masuk dan keluar dari proses itu; ini \"kontrak\" yang tidak boleh berubah.", "Pecah menjadi 3-7 subproses dan beri nomor turunan.", "Bagikan tiap aliran kontrak ke subproses yang tepat.", "Tambahkan aliran antarsubproses dan data store yang hanya dipakai di dalam.", "Periksa balancing, lalu ulangi hanya untuk subproses yang masih rumit."]}], "karier": {"intro": "Di industri, pemetaan proses adalah langkah pertama hampir setiap proyek perbaikan atau digitalisasi. Notasinya bisa berbeda (BPMN, SIPOC, value stream map), tetapi cara berpikirnya sama dengan DFD: siapa memberi apa, diolah di mana, disimpan di mana, keluar ke siapa.", "peran": [["Business process analyst", "Memetakan proses as-is dan to-be sebelum otomasi atau implementasi ERP"], ["System analyst", "Membuat DFD, BPMN, atau use case sebagai spesifikasi untuk pengembang"], ["IT / internal auditor", "Menelusuri aliran data untuk menemukan titik tanpa kendali"], ["Lean / continuous improvement engineer", "Mencari pemborosan informasi: input ganda, serah terima berlebih, data tidak terpakai"], ["Data engineer", "Merancang alur data (pipeline) dari sumber ke gudang data"]], "skill": ["Pemodelan proses: DFD, BPMN, flowchart, SIPOC", "Berpikir dekomposisi: dari gambaran besar ke rincian", "Alat bantu: draw.io, Lucidchart, Visio, Bizagi"]}, "kunci": [["Model logis", "Menggambarkan apa yang dilakukan sistem, bukan cara implementasinya"], ["DFD", "Diagram aliran data melalui proses-proses sistem"], ["Diagram konteks", "DFD paling atas: satu proses dan entitas eksternal"], ["Diagram dekomposisi", "Bagan hierarki pemecahan fungsi sistem"], ["Entitas eksternal", "Sumber atau tujuan data di luar sistem"], ["Data store", "Tempat data disimpan"], ["Balancing / leveling", "Masukan dan keluaran induk sama dengan diagram anaknya"], ["Kamus data", "Daftar definisi tiap item data pada DFD"], ["Black hole / miracle", "Proses tanpa keluaran / proses tanpa masukan"]], "kuis": [["Sebutkan empat simbol DFD.", "Proses, entitas eksternal, data store, aliran data."], ["Mengapa DFD bukan flowchart?", "DFD menunjukkan aliran data, tidak menyiratkan urutan atau keputusan logis, dan prosesnya bisa berjalan paralel; flowchart menunjukkan aliran kendali."], ["Bolehkah data mengalir langsung dari pelanggan ke data store?", "Tidak. Harus melalui proses."], ["Apa itu balancing?", "Menjaga masukan dan keluaran proses induk tetap sama dengan yang muncul di diagram rinciannya."], ["Apa fungsi diagram konteks?", "Menetapkan lingkup dan batas sistem, serta menunjukkan interaksi sistem dengan pihak luar."], ["Pada kasus retail fashion, mengapa stok dicatat di data store tersendiri per toko?", "Karena soal meminta sistem mengetahui barang kode tertentu ada di toko mana dan berapa jumlahnya; website lalu menampilkan penjumlahan dari semua toko."]]}, {"id": "m7", "no": 7, "minggu": "Minggu 7-8", "judul": "Pemodelan Data (ERD)", "sumber": "7---Pemodelan-Data.pdf (14 slide) dan 8---Pemodelan-Data.pdf (11 slide)", "ringkas": "Menggambar data yang disimpan sistem: entitas, atribut, relasi, kardinalitas, entitas asosiatif, dan pembahasan ERD retail fashion.", "tujuan": ["Menjelaskan komponen model E-R: entitas, atribut, relasi", "Membedakan jenis atribut", "Menentukan derajat, konektivitas, dan kardinalitas relasi", "Memecah relasi M:N dengan entitas asosiatif", "Menyusun ERD dari narasi kasus"], "blocks": [{"t": "h", "x": "Komponen model E-R"}, {"t": "ul", "x": ["**Entitas**: sesuatu yang datanya ingin disimpan (orang, benda, kejadian). Dalam model E-R, \"entitas\" merujuk pada himpunan entitas. Digambar sebagai persegi panjang berisi nama entitas.", "**Atribut**: karakteristik entitas. Digambar oval yang terhubung ke entitas. Tiap atribut punya **domain**, yaitu himpunan nilai yang mungkin. **Kunci utama (primary key)** digarisbawahi.", "**Relasi**: hubungan antarentitas. Digambar belah ketupat berisi kata kerja."]}, {"t": "img", "f": "d7_notasi_erd.png", "cap": "Diagram rangkuman: komponen ERD notasi Chen dan jenis atribut"}, {"t": "img", "f": "s7_p05.jpg", "cap": "Slide kuliah hlm. 5: penyajian entitas dasar: atribut kunci dan atribut bernilai banyak"}, {"t": "h", "x": "Jenis atribut"}, {"t": "table", "head": ["Jenis", "Arti", "Contoh"], "rows": [["Simple", "Tidak bisa dibagi lagi", "Umur, jenis kelamin, status nikah"], ["Composite", "Bisa dibagi menjadi atribut lain", "Alamat: jalan, kota, provinsi, kode pos"], ["Single-valued", "Hanya satu nilai", "NIK seseorang, nomor seri suku cadang"], ["Multivalued", "Bisa banyak nilai; digambar garis ganda", "Gelar seseorang, nomor telepon sebuah rumah"], ["Derived", "Tidak disimpan; dihitung dengan algoritma; digambar garis putus-putus", "Umur dihitung dari tanggal lahir dan tanggal hari ini"]], "w": [1.5, 2.9, 2.5]}, {"t": "img", "f": "s7_p06.jpg", "cap": "Slide kuliah hlm. 6: atribut turunan"}, {"t": "box", "kind": "contoh", "title": "Latihan cepat", "x": ["Entitas KARYAWAN: NIP (kunci, simple, single-valued), nama lengkap (composite: depan, belakang), keahlian (multivalued), masa kerja (derived dari tanggal masuk)."]}, {"t": "h", "x": "Derajat relasi"}, {"t": "ul", "x": ["**Unary**: relasi di dalam satu entitas. Contoh: KARYAWAN mengelola KARYAWAN.", "**Binary**: relasi antara dua entitas. Paling umum. Contoh: DOSEN mengajar KELAS.", "**Ternary**: relasi antara tiga entitas. Contoh di slide: CONTRIBUTOR, RECIPIENT, dan FUND terhubung lewat CFR."]}, {"t": "img", "f": "s7_p08.jpg", "cap": "Slide kuliah hlm. 8: tiga derajat relasi"}, {"t": "p", "x": "**Entitas rekursif** muncul pada relasi unary: relasi terjadi antara kemunculan dari himpunan entitas yang sama. Contoh slide: karyawan menikah dengan karyawan (1:1), karyawan mengelola karyawan (1:M), mata kuliah mensyaratkan mata kuliah (M:N)."}, {"t": "img", "f": "s7_p11.jpg", "cap": "Slide kuliah hlm. 11: relasi rekursif"}, {"t": "h", "x": "Konektivitas dan kardinalitas"}, {"t": "p", "x": "**Konektivitas** menyatakan klasifikasi relasi: satu-ke-satu (1:1), satu-ke-banyak (1:M), banyak-ke-banyak (M:N). **Kardinalitas** menyatakan jumlah spesifik kemunculan entitas yang terkait dengan satu kemunculan entitas lain, ditulis (min, maks)."}, {"t": "table", "head": ["Konektivitas", "Contoh", "Cara membaca"], "rows": [["1:1", "DOSEN mengepalai PROGRAM STUDI", "Satu dosen mengepalai paling banyak satu prodi; satu prodi dikepalai satu dosen"], ["1:M", "DOSEN mengajar KELAS", "Satu dosen mengajar banyak kelas; satu kelas diajar satu dosen"], ["M:N", "MAHASISWA mengambil KELAS", "Satu mahasiswa mengambil banyak kelas; satu kelas diikuti banyak mahasiswa"]], "w": [1.2, 2.4, 3.3]}, {"t": "img", "f": "s7_p10.jpg", "cap": "Slide kuliah hlm. 10: konektivitas dan kardinalitas pada ERD"}, {"t": "box", "kind": "contoh", "title": "Membaca kardinalitas di slide", "x": ["Pada relasi PROFESSOR mengajar CLASS tertulis (0,3) dan (1,1): tiap kelas diajar tepat satu profesor; seorang profesor mengajar minimal 0 dan maksimal 3 kelas. STUDENT terdaftar di CLASS dengan (1,6) dan (0,35): mahasiswa mengambil 1 sampai 6 kelas; satu kelas berisi 0 sampai 35 mahasiswa."]}, {"t": "box", "kind": "tips", "title": "Trik menentukan kardinalitas", "x": ["Selalu ajukan dua pertanyaan, satu untuk tiap arah: \"Satu A berhubungan dengan berapa B?\" lalu \"Satu B berhubungan dengan berapa A?\" Jawaban \"banyak\" di kedua arah berarti M:N."]}, {"t": "h", "x": "Entitas asosiatif"}, {"t": "p", "x": "Entitas asosiatif berfungsi sebagai **jembatan** antara entitas yang berelasi. Ia memecah relasi M:N menjadi dua relasi 1:M, tersusun dari kunci utama tiap entitas yang dihubungkan, dan boleh memuat atribut tambahan yang khas bagi relasi tersebut."}, {"t": "img", "f": "d7_entitas_asosiatif.png", "cap": "Diagram rangkuman: memecah M:N dengan entitas asosiatif"}, {"t": "img", "f": "s8_p05.jpg", "cap": "Slide kuliah hlm. 5: entitas komposit ENROLL antara STUDENT dan CLASS"}, {"t": "box", "kind": "langkah", "title": "Memecah relasi M:N", "x": ["Buat entitas baru di antara dua entitas yang berelasi M:N.", "Masukkan kunci utama kedua entitas sebagai kunci entitas baru.", "Pindahkan atribut yang menjadi milik relasi (jumlah, tanggal, nilai) ke entitas baru.", "Ganti relasi M:N dengan dua relasi 1:M yang mengarah ke entitas baru.", "Beri nama yang bermakna, misalnya PENGAMBILAN atau DETAIL_PESANAN."]}, {"t": "h", "x": "Menyusun ERD"}, {"t": "p", "x": "Perancangan basis data bersifat **iteratif**, bukan linear. Biasanya dimulai dari narasi umum tentang operasi dan prosedur organisasi, lalu ERD digambar dan ditinjau, dan diulang sampai pengguna dan perancang sepakat bahwa ERD mewakili kegiatan organisasi dengan wajar."}, {"t": "ol", "x": ["Garis bawahi **kata benda** pada narasi: calon entitas dan atribut.", "Garis bawahi **kata kerja** yang menghubungkan kata benda: calon relasi.", "Tentukan kunci utama tiap entitas.", "Tentukan konektivitas tiap relasi dengan dua pertanyaan arah.", "Pecah tiap relasi M:N dengan entitas asosiatif; pindahkan atribut milik relasi ke sana.", "Periksa ulang terhadap narasi: adakah informasi yang diminta soal tetapi tidak bisa dijawab oleh ERD?"]}, {"t": "box", "kind": "aturan", "title": "Aturan ERD", "x": ["Tiap entitas punya kunci utama yang unik dan tidak kosong.", "Nama entitas kata benda tunggal; nama relasi kata kerja.", "Satu atribut hanya berada di satu entitas (kecuali sebagai kunci tamu).", "Atribut turunan tidak disimpan.", "Atribut bernilai banyak dijadikan entitas tersendiri saat implementasi.", "Relasi M:N dipecah sebelum dijadikan tabel."]}, {"t": "box", "kind": "tips", "title": "Tips", "x": ["Bedakan entitas dan atribut dengan pertanyaan: apakah benda ini punya data sendiri yang perlu disimpan? Jika ya, entitas.", "Uji ERD dengan pertanyaan dari soal, misalnya \"barang X ada di toko mana saja?\". Jika tidak bisa dijawab dengan menelusuri relasi, ada yang kurang."]}, {"t": "h", "x": "Pembahasan latihan: ERD retail fashion"}, {"t": "p", "x": "Soal Modul 8 memakai kasus yang sama dengan latihan DFD. Petunjuk penting dari narasi:"}, {"t": "ul", "x": ["\"Untuk setiap purchase order, pengiriman dapat dilakukan dalam beberapa delivery order\": PURCHASE_ORDER 1:M DELIVERY_ORDER.", "\"Barang dengan kode tertentu ada di toko mana saja dan berapa jumlah stok\": TOKO M:N BARANG, dipecah menjadi STOK dengan atribut jumlah_stok.", "Penjualan offline mencatat toko, tanggal, barang-barang, total, kartu: PENJUALAN_OFFLINE dengan DETAIL_JUAL_OFFLINE.", "Pesanan online: pelanggan, nomor pesanan, barang-barang, kartu: PELANGGAN 1:M PESANAN_ONLINE, dengan DETAIL_PESANAN.", "\"Bisa lebih dari satu toko yang mengirimkan\" dan \"mencatat toko yang mengeksekusi untuk tiap barang\" serta \"tanggal barang dikirimkan\": toko pengirim dan tanggal kirim ditaruh di **DETAIL_PESANAN**, bukan di PESANAN_ONLINE."]}, {"t": "img", "f": "d7_erd_retail.png", "cap": "Diagram rangkuman: ERD SI retail fashion"}, {"t": "box", "kind": "awas", "title": "Catatan jawaban", "x": ["Ini salah satu alternatif jawaban, bukan kunci resmi. Diagram memakai kotak berisi daftar atribut agar ringkas; pada notasi Chen di slide, atribut digambar sebagai oval. Soal membebaskan mahasiswa menentukan data purchase order dan delivery order, jadi atributnya bisa berbeda. Stok gabungan di website tidak disimpan: itu atribut turunan, dihitung dari penjumlahan STOK semua toko."]}, {"t": "box", "kind": "tips", "title": "Cocokkan DFD dengan ERD", "x": ["Tiap data store di DFD level 0 (Materi 6) harus muncul sebagai satu atau beberapa entitas di ERD: D5 Stok per Toko menjadi STOK; D2 menjadi PENJUALAN_OFFLINE, PESANAN_ONLINE, dan detailnya. Jika ada data store tanpa entitas atau sebaliknya, salah satu model belum lengkap."]}], "karier": {"intro": "Data adalah aset yang paling lama bertahan dalam sistem: aplikasi bisa diganti, struktur datanya diwariskan. Orang yang bisa membaca dan merancang ERD bisa berbicara langsung dengan tim data dan menulis kueri sendiri tanpa menunggu orang IT.", "peran": [["Data analyst / BI developer", "Memahami relasi tabel agar kueri SQL dan dashboard tidak salah hitung"], ["Database designer / data engineer", "Merancang skema, kunci, dan relasi; menyiapkan data warehouse"], ["Konsultan ERP", "Memahami master data (barang, pemasok, pelanggan) dan data transaksi serta hubungannya"], ["System analyst", "Menyusun model data sebagai bagian dari system proposal"], ["Supply chain / PPIC analyst", "Menata master data material, bill of material, dan lokasi gudang yang pada dasarnya adalah relasi M:N"]], "skill": ["SQL (JOIN bergantung pada pemahaman relasi)", "Normalisasi dan perancangan kunci", "Alat bantu: dbdiagram.io, draw.io, MySQL Workbench"]}, "kunci": [["Entitas", "Objek yang datanya disimpan"], ["Atribut", "Karakteristik entitas"], ["Primary key", "Atribut yang mengenali tiap kemunculan entitas secara unik"], ["Foreign key", "Atribut yang merujuk ke primary key entitas lain"], ["Atribut turunan", "Atribut yang dihitung, tidak disimpan"], ["Atribut multivalued", "Atribut yang bisa bernilai banyak"], ["Konektivitas", "Klasifikasi relasi: 1:1, 1:M, M:N"], ["Kardinalitas", "Jumlah minimum dan maksimum kemunculan yang berelasi"], ["Entitas asosiatif", "Entitas jembatan pemecah relasi M:N"], ["Relasi rekursif", "Relasi entitas dengan dirinya sendiri (unary)"]], "kuis": [["Sebutkan tiga komponen model E-R.", "Entitas, atribut, relasi."], ["Beri contoh atribut turunan.", "Umur (dihitung dari tanggal lahir), masa kerja, total stok gabungan."], ["Apa beda konektivitas dan kardinalitas?", "Konektivitas adalah klasifikasi relasi (1:1, 1:M, M:N); kardinalitas adalah angka spesifik minimum dan maksimum kemunculan."], ["Mengapa relasi M:N perlu dipecah?", "Karena tidak bisa langsung diwujudkan menjadi tabel; entitas asosiatif memecahnya menjadi dua relasi 1:M dan menampung atribut milik relasi."], ["Apa itu relasi unary? Beri contoh.", "Relasi di dalam satu entitas, misalnya KARYAWAN mengelola KARYAWAN."], ["Pada kasus retail fashion, di entitas mana toko pengirim dicatat, dan mengapa?", "Di DETAIL_PESANAN, karena tiap barang dalam satu pesanan bisa dikirim dari toko yang berbeda."]]}, {"id": "m8", "no": 8, "minggu": "Minggu 12", "judul": "Manajemen Proyek Sistem Informasi", "sumber": "11-IS-Project-Management-Compiled-Audio.pdf (37 slide)", "ringkas": "Mengelola proyek SI: lingkup, WBS, estimasi durasi, ketergantungan tugas, PERT dan Gantt, sumber daya, tim, pengendalian, dan manajemen ekspektasi.", "tujuan": ["Menjelaskan proyek, manajemen proyek, dan ukuran sukses proyek SI", "Menyusun WBS dan mengestimasi durasi tugas", "Menentukan ketergantungan tugas, jalur kritis, dan slack", "Menjelaskan resource leveling", "Memakai matriks manajemen ekspektasi", "Menyebutkan penyebab kegagalan proyek"], "blocks": [{"t": "h", "x": "Proyek dan ukuran suksesnya"}, {"t": "p", "x": "**Proyek** adalah rangkaian aktivitas yang sementara, unik, kompleks, dan saling terhubung, dengan satu tujuan, yang harus selesai pada waktu tertentu, sesuai anggaran, dan sesuai spesifikasi. **Manajemen proyek** adalah proses menentukan lingkup, merencanakan, menyusun staf, mengorganisasi, mengarahkan, dan mengendalikan pengembangan sistem yang dapat diterima dengan biaya minimum dalam kerangka waktu tertentu."}, {"t": "p", "x": "Proyek SI sukses bila: sistem **diterima pelanggan**, diserahkan **tepat waktu**, **sesuai anggaran**, dan proses pengembangannya **berdampak minimal pada operasi bisnis** yang sedang berjalan. Fungsi manajemen proyek terbagi dua: **plan** (scoping, planning, estimating, scheduling) dan **control** (organizing, directing, controlling, closing)."}, {"t": "h", "x": "Alat: PERT dan Gantt"}, {"t": "ul", "x": ["**PERT chart**: model jaringan grafis yang menggambarkan tugas-tugas proyek dan hubungan antartugas. Kuat untuk melihat ketergantungan.", "**Gantt chart**: diagram batang horizontal; tiap batang satu tugas, sumbu mendatar adalah kalender. Kuat untuk melihat jadwal dan kemajuan."]}, {"t": "img", "f": "s11_p07.jpg", "cap": "Slide kuliah hlm. 7: PERT chart"}, {"t": "img", "f": "s11_p08.jpg", "cap": "Slide kuliah hlm. 8: Gantt chart"}, {"t": "h", "x": "Siklus manajemen proyek: tujuh aktivitas"}, {"t": "img", "f": "s11_p12.jpg", "cap": "Slide kuliah hlm. 12: project management life cycle"}, {"t": "p", "x": "**Aktivitas 1: negosiasi lingkup.** Lingkup menetapkan batas proyek: bagian bisnis mana yang dipelajari, dianalisis, dirancang, dibangun, dan diperbaiki. Lima hal yang dinegosiasikan: produk, mutu, waktu, biaya, sumber daya. Hasilnya **statement of work**, uraian naratif pekerjaan yang akan dilakukan."}, {"t": "p", "x": "**Aktivitas 2: identifikasi tugas.** **Work Breakdown Structure (WBS)** adalah pemecahan hierarkis proyek menjadi fase, aktivitas, dan tugas. **Milestone** adalah peristiwa yang menandai selesainya deliverable utama."}, {"t": "img", "f": "d8_wbs.png", "cap": "Diagram rangkuman: WBS proyek SI penjualan toko fashion"}, {"t": "img", "f": "s11_p15.jpg", "cap": "Slide kuliah hlm. 15: dua cara menulis WBS: daftar bernomor dan bagan"}, {"t": "p", "x": "**Aktivitas 3: estimasi durasi tugas.** Tentukan durasi optimistis (OD), pesimistis (PD), dan yang diharapkan (ED), lalu hitung durasi paling mungkin: **D = (OD + 4 x ED + PD) / 6**."}, {"t": "box", "kind": "contoh", "title": "Hitung durasi konstruksi", "x": ["Programmer berkata: paling cepat 2 minggu, biasanya 3 minggu, kalau banyak revisi 10 minggu. D = (2 + 4x3 + 10) / 6 = 24 / 6 = 4 minggu. Nilai pesimistis yang jauh menarik estimasi ke atas; itulah gunanya rumus ini dibanding sekadar memakai angka \"biasanya\"."]}, {"t": "p", "x": "**Aktivitas 4: tentukan ketergantungan antartugas.**"}, {"t": "table", "head": ["Jenis", "Arti", "Contoh"], "rows": [["Finish-to-start (FS)", "Selesainya satu tugas memicu mulainya tugas lain", "Desain basis data selesai, baru coding dimulai"], ["Start-to-start (SS)", "Mulainya satu tugas memicu mulainya tugas lain", "Penulisan panduan dimulai saat pengujian dimulai"], ["Finish-to-finish (FF)", "Dua tugas harus selesai bersamaan", "Pelatihan dan migrasi data selesai bersamaan sebelum go-live"], ["Start-to-finish (SF)", "Mulainya satu tugas menandai selesainya tugas lain", "Sistem lama dimatikan ketika sistem baru mulai beroperasi"]], "w": [1.6, 2.6, 2.7]}, {"t": "p", "x": "Strategi penjadwalan: **forward scheduling** menetapkan tanggal mulai lalu menjadwalkan maju sampai didapat tanggal selesai; **reverse scheduling** menetapkan tenggat lalu menjadwalkan mundur."}, {"t": "p", "x": "**Aktivitas 5: alokasikan sumber daya.** Lima jenis: orang, jasa, fasilitas dan peralatan, perlengkapan dan bahan, serta uang. **Resource leveling** memperbaiki alokasi berlebih dengan **menunda** atau **memecah** tugas."}, {"t": "ul", "x": ["**Jalur kritis**: urutan tugas saling bergantung dengan jumlah durasi terbesar; menentukan tanggal selesai paling awal proyek. Tugas di jalur kritis tidak bisa ditunda tanpa menunda proyek, jadi hanya bisa **dipecah**.", "**Slack time**: lama penundaan yang masih bisa ditoleransi tugas non-kritis tanpa menunda proyek. Tugas yang punya slack bisa **ditunda** untuk meratakan sumber daya."]}, {"t": "img", "f": "d8_jalur_kritis.png", "cap": "Diagram rangkuman: jaringan tugas dan jalur kritis"}, {"t": "img", "f": "d8_gantt.png", "cap": "Diagram rangkuman: Gantt chart untuk proyek yang sama"}, {"t": "box", "kind": "contoh", "title": "Membaca dua diagram di atas", "x": ["Analis yang sama mengerjakan B (model proses) dan C (model data) pada minggu 4-5, jadi ia kelebihan beban. B ada di jalur kritis sehingga tidak boleh digeser. C punya slack 1 minggu: geser C satu minggu dan proyek tetap selesai di minggu 15. Bila slack tidak cukup, tambah orang atau terima proyek mundur."]}, {"t": "p", "x": "**Aktivitas 6: arahkan kerja tim.** Tim berkembang melalui empat tahap:"}, {"t": "table", "head": ["Tahap", "Nama pada slide", "Yang terjadi"], "rows": [["Forming", "Orientasi", "Menetapkan struktur dan aturan, memperjelas hubungan dan tanggung jawab, menyusun rencana"], ["Storming", "Pemecahan masalah internal", "Menyelesaikan konflik antarpribadi, memperjelas aturan dan tujuan, membangun iklim partisipatif"], ["Norming", "Pertumbuhan dan produktivitas", "Aktivitas tim mengarah ke tujuan, saling memberi umpan balik, kekompakan tumbuh"], ["Performing", "Evaluasi dan kendali", "Umpan balik dan evaluasi lebih banyak, norma dipatuhi, peran menguat, motivasi bersama kuat"]], "w": [1.2, 2.2, 3.5]}, {"t": "p", "x": "**Aktivitas 7: pantau dan kendalikan kemajuan.** Meliputi pelaporan kemajuan, manajemen perubahan, manajemen ekspektasi, dan penyesuaian jadwal dengan analisis jalur kritis."}, {"t": "box", "kind": "langkah", "title": "Membuat WBS", "x": ["Tulis tujuan proyek sebagai kotak paling atas.", "Pecah menjadi fase atau deliverable utama.", "Pecah tiap fase menjadi aktivitas, lalu tugas.", "Berhenti ketika tugas bisa diestimasi dan ditugaskan ke satu orang atau tim.", "Beri nomor bertingkat (1, 1.1, 1.1.1) dan tandai milestone."]}, {"t": "box", "kind": "langkah", "title": "Mencari jalur kritis", "x": ["Daftar tugas, durasi, dan tugas pendahulunya.", "Gambar jaringan: kotak untuk tugas, panah untuk ketergantungan.", "Tulis semua jalur dari awal sampai akhir dan jumlahkan durasinya.", "Jalur terpanjang adalah jalur kritis; panjangnya adalah durasi proyek.", "Slack tugas non-kritis = durasi jalur kritis dikurangi jalur terpanjang yang melewati tugas itu."]}, {"t": "box", "kind": "langkah", "title": "Membuat Gantt chart", "x": ["Tulis tugas berurutan di kolom kiri.", "Buat skala waktu mendatar (hari, minggu, atau bulan).", "Gambar batang tiap tugas mulai dari saat semua pendahulunya selesai.", "Tandai tugas kritis dengan warna berbeda dan tambahkan milestone.", "Saat proyek berjalan, arsir bagian yang sudah selesai dan tarik garis \"hari ini\"."]}, {"t": "box", "kind": "aturan", "title": "Aturan penjadwalan", "x": ["Tiap tugas di WBS muncul tepat satu kali di jadwal.", "Tugas tidak boleh mulai sebelum pendahulunya memenuhi jenis ketergantungannya.", "Tugas kritis tidak boleh ditunda; untuk meratakan beban hanya boleh dipecah.", "Perubahan lingkup harus diikuti perubahan jadwal, biaya, atau prioritas."]}, {"t": "box", "kind": "tips", "title": "Tips", "x": ["Estimasi dibuat oleh orang yang akan mengerjakan, bukan oleh manajer saja.", "Sisakan cadangan waktu di akhir proyek, bukan di tiap tugas.", "Laporkan kemajuan dengan ukuran selesai atau belum, bukan \"90% selesai\"."]}, {"t": "h", "x": "Manajemen ekspektasi"}, {"t": "p", "x": "**Matriks manajemen ekspektasi** membantu manajemen memahami dampak perubahan parameter proyek. Aturannya: tiga ukuran sukses (biaya, jadwal, lingkup/mutu) masing-masing diberi satu prioritas berbeda: satu yang **dimaksimalkan atau diminimalkan**, satu yang menjadi **batasan**, dan satu yang **diterima** apa adanya. Tidak boleh ada dua tanda di satu kolom."}, {"t": "table", "head": ["Ukuran sukses", "Maks / Min", "Batasan", "Diterima"], "rows": [["Biaya: sekitar USD 20 miliar", "", "", "X"], ["Jadwal: tenggat 31 Des 1969", "", "X", ""], ["Lingkup/mutu: mendaratkan manusia di bulan dan membawanya pulang dengan selamat", "X", "", ""]], "w": [3.6, 1.1, 1.1, 1.1]}, {"t": "p", "x": "Tabel di atas adalah contoh proyek pendaratan di bulan dari slide: mutu dimaksimalkan, jadwal menjadi batasan, biaya diterima berapa pun. Bila di tengah jalan pengguna meminta fitur tambahan (lingkup naik), manajer proyek menunjukkan matriks ini: sesuatu harus bergeser, entah anggaran ditambah, tenggat diundur, atau prioritas ditukar."}, {"t": "img", "f": "s11_p34.jpg", "cap": "Slide kuliah hlm. 34: matriks ekspektasi proyek pendaratan di bulan"}, {"t": "box", "kind": "contoh", "title": "Tugas besar kuliah", "x": ["Tenggat pengumpulan tidak bisa diubah (batasan). Nilai ingin setinggi mungkin (mutu dimaksimalkan). Maka yang harus diterima adalah \"biaya\": jam begadang dan waktu main yang hilang. Bila jam kerja juga tidak mau ditambah, lingkup tugas yang harus dipangkas."]}, {"t": "box", "kind": "langkah", "title": "Mengisi matriks manajemen ekspektasi", "x": ["Tulis ukuran sukses untuk biaya, jadwal, dan lingkup/mutu.", "Tanyakan ke pemilik sistem: mana yang paling penting untuk dimaksimalkan atau diminimalkan?", "Tentukan satu yang menjadi batasan tetap.", "Sisanya adalah yang diterima menyesuaikan.", "Pastikan tiap baris dan tiap kolom hanya berisi satu tanda.", "Saat ada permintaan perubahan, buka kembali matriks dan sepakati apa yang bergeser."]}, {"t": "h", "x": "Penyebab kegagalan proyek dan kompetensi manajer proyek"}, {"t": "ul", "x": ["Tidak ada komitmen manajemen puncak", "Organisasi tidak berkomitmen pada metodologi pengembangan", "Mengambil jalan pintas dari metodologi", "Manajemen ekspektasi yang buruk", "Komitmen terlalu dini pada anggaran dan jadwal tetap", "Teknik estimasi buruk dan terlalu optimistis", "Mythical man-month (Brooks, 1975): menambah orang pada proyek yang terlambat justru membuatnya makin terlambat", "Keterampilan mengelola orang kurang", "Gagal menyesuaikan dengan perubahan bisnis", "Sumber daya tidak cukup", "Gagal \"mengelola sesuai rencana\""]}, {"t": "p", "x": "Kompetensi manajer proyek menurut slide: komitmen pada mutu, inisiatif, berpikir analitis dan konseptual, kepekaan antarpribadi, fleksibilitas, antisipasi dampak, memotivasi dan mengembangkan orang lain, komunikasi, pemantauan dan pengendalian, percaya diri, manajemen stres, dan menjaga kredibilitas."}, {"t": "box", "kind": "latihan", "title": "Latihan jalur kritis", "x": ["Ambil tabel 8-10 tugas dengan durasi dan pendahulunya. (1) Gambar jaringannya, (2) daftar semua jalur dan panjangnya, (3) tandai jalur kritis, (4) hitung slack tiap tugas non-kritis, (5) gambar Gantt. Tutup dengan pertanyaan: jika tugas X molor 2 minggu, apakah proyek ikut molor?"]}], "karier": {"intro": "Hampir semua pekerjaan lulusan TI berbentuk proyek: instalasi lini baru, implementasi ERP, peluncuran produk, perbaikan proses. Kemampuan memecah pekerjaan, mengestimasi, dan mengelola ekspektasi atasan adalah yang paling cepat mengantar ke posisi pemimpin.", "peran": [["Project manager / PMO", "Menyusun rencana, WBS, jadwal, anggaran; melaporkan kemajuan dan mengelola perubahan"], ["Scrum master / delivery manager", "Versi agile dari pengendalian proyek: sprint planning, burndown, retrospektif"], ["Konsultan implementasi", "Mengelola proyek klien dengan milestone dan steering committee"], ["Production / NPI engineer", "Menjadwalkan peluncuran produk baru dengan jalur kritis dan resource leveling"], ["Management trainee", "Sering diberi proyek perbaikan 3-6 bulan sebagai ujian pertama"]], "skill": ["Alat: MS Project, Jira, Trello, Asana, atau Gantt di spreadsheet", "Sertifikasi yang dikenal industri: CAPM/PMP, PRINCE2, Scrum", "Negosiasi lingkup dan komunikasi dengan pemangku kepentingan"]}, "kunci": [["Statement of work", "Uraian naratif pekerjaan proyek"], ["WBS", "Pemecahan hierarkis proyek menjadi fase, aktivitas, tugas"], ["Milestone", "Penanda selesainya deliverable utama"], ["PERT", "Diagram jaringan tugas dan ketergantungannya"], ["Gantt chart", "Diagram batang tugas terhadap kalender"], ["Jalur kritis", "Rangkaian tugas terpanjang; penentu durasi proyek"], ["Slack time", "Kelonggaran tugas non-kritis"], ["Resource leveling", "Meratakan beban sumber daya dengan menunda atau memecah tugas"], ["Matriks ekspektasi", "Alat menetapkan prioritas biaya, jadwal, lingkup/mutu"], ["Mythical man-month", "Menambah orang pada proyek terlambat memperlambatnya"]], "kuis": [["Sebutkan empat ukuran sukses proyek SI.", "Diterima pelanggan, tepat waktu, sesuai anggaran, dampak minimal pada operasi bisnis berjalan."], ["Hitung D bila OD = 4, ED = 6, PD = 14 hari.", "(4 + 24 + 14) / 6 = 7 hari."], ["Apa itu jalur kritis?", "Urutan tugas saling bergantung dengan jumlah durasi terbesar; menentukan tanggal selesai paling awal proyek."], ["Tugas di jalur kritis kelebihan beban. Ditunda atau dipecah?", "Dipecah. Menundanya akan menunda seluruh proyek."], ["Sebutkan empat jenis ketergantungan tugas.", "Finish-to-start, start-to-start, finish-to-finish, start-to-finish."], ["Apa aturan mengisi matriks manajemen ekspektasi?", "Tiap ukuran (biaya, jadwal, lingkup/mutu) mendapat satu prioritas berbeda: satu dimaksimalkan/diminimalkan, satu menjadi batasan, satu diterima."], ["Apa maksud mythical man-month?", "Tenaga dan waktu tidak bisa saling ditukar begitu saja; menambah orang pada proyek yang terlambat menambah beban komunikasi dan pelatihan sehingga makin terlambat."]]}, {"id": "m9", "no": 9, "minggu": "Minggu 13", "judul": "Implementasi Sistem Informasi", "sumber": "12---Implementasi-Sistem-Informasi.pdf (37 slide)", "ringkas": "Setelah sistem jadi: ukuran sukses, kesenjangan pengguna dan perancang, mengelola risiko dan resistensi, implementasi sebagai perubahan dan pembelajaran, serta isu implementasi ERP.", "tujuan": ["Menjelaskan peta aplikasi SI dan peran ERP, SCM, CRM", "Menyebutkan ukuran keberhasilan SI", "Menjelaskan kesenjangan komunikasi pengguna dan perancang", "Menjelaskan alat integrasi, alat perencanaan dan kendali, serta tiga teori resistensi", "Menjelaskan implementasi sebagai proses perubahan, pembelajaran, dan alih pengetahuan", "Menjelaskan isu fase proyek dan pasca-proyek pada implementasi ERP"], "blocks": [{"t": "h", "x": "Peta aplikasi SI"}, {"t": "p", "x": "Slide membuka dengan tujuh jenis aplikasi: TPS, MIS, DSS, EIS, expert system, **communications and collaboration system** (memperlancar komunikasi antara pekerja, mitra, pelanggan, pemasok), dan **office automation system** (mendukung kegiatan kantor dan alur kerja). Lima yang pertama sudah dibahas di Materi 2."}, {"t": "p", "x": "SI tradisional berdiri sendiri-sendiri dengan basis data tertutup: penjualan, produksi, dan pembelian punya data masing-masing. Arah perkembangannya adalah **federasi SI** yang saling terhubung, dengan **ERP sebagai tulang punggung**."}, {"t": "ul", "x": ["**ERP**: sistem besar dan terintegrasi untuk pemrosesan transaksi dan pelaporan bisnis.", "**CRM**: perencanaan, pengendalian, dan SI yang menghubungkan perusahaan dengan pelanggan di hilir.", "**SRM**: perencanaan, pengendalian, dan SI yang menghubungkan perusahaan dengan pemasok di hulu.", "**SCM**: payung yang mencakup hubungan hulu sampai hilir."]}, {"t": "img", "f": "d9_erp_backbone.png", "cap": "Diagram rangkuman: ERP di tengah, SCM/SRM di hulu, CRM di hilir"}, {"t": "img", "f": "s12_p05.jpg", "cap": "Slide kuliah hlm. 5: federasi SI: front-office dan back-office (Whitten, Bentley, Dittman, 2004)"}, {"t": "img", "f": "s12_p07.jpg", "cap": "Slide kuliah hlm. 7: ERP sebagai tulang punggung"}, {"t": "h", "x": "Ukuran keberhasilan SI"}, {"t": "ol", "x": ["**Tingkat penggunaan tinggi**", "**Kepuasan pengguna**", "**Sikap yang mendukung**: disiplin dan rutin, keputusan berbasis data, koordinasi", "**Tujuan tercapai**", "**Imbal hasil finansial**"]}, {"t": "box", "kind": "contoh", "title": "Sistem jadi tetapi gagal", "x": ["Rumah sakit memasang rekam medis elektronik. Secara teknis berjalan, tetapi perawat tetap menulis di kertas lalu menyalin ke sistem di akhir shift. Tingkat penggunaan nyata rendah, kepuasan rendah, kerja ganda. Menurut lima ukuran di atas, implementasinya belum berhasil."]}, {"t": "h", "x": "Masalah 1: kesenjangan komunikasi pengguna dan perancang"}, {"t": "p", "x": "Latar belakang, minat, dan prioritas yang berbeda menghambat komunikasi dan pemecahan masalah antara pengguna akhir dan spesialis SI."}, {"t": "table", "head": ["Kepedulian pengguna", "Kepedulian perancang"], "rows": [["Apakah sistem memberi informasi yang saya butuhkan?", "Seberapa besar upaya pengembangan sistem?"], ["Seberapa cepat saya bisa mengakses data?", "Seberapa besar upaya pemeliharaannya?"], ["Seberapa mudah saya menerima data?", "Berapa biaya dan waktu untuk memenuhi semua keinginan pengguna?"], ["Berapa banyak bantuan administrasi untuk entri data?", ""], ["Bagaimana operasi sistem masuk ke jadwal kerja harian saya?", ""]], "w": [3.5, 3.4]}, {"t": "h", "x": "Masalah 2: mengelola proyek SI besar"}, {"t": "p", "x": "Empat tantangannya: mengendalikan faktor risiko, alat perencanaan dan kendali formal, mengatasi resistensi pengguna, dan merancang untuk organisasi."}, {"t": "table", "head": ["Alat", "Tujuan", "Bentuk"], "rows": [["Integrasi eksternal", "Menghubungkan kerja tim implementasi dengan pengguna di semua tingkat", "Pengguna menjadi ketua atau wakil tim; steering committee pengguna; pengguna anggota aktif tim; persetujuan pengguna atas spesifikasi; notulen disebar luas; pengguna memimpin pelatihan dan instalasi; pengguna bertanggung jawab atas change control"], ["Integrasi internal", "Memastikan tim implementasi bekerja sebagai satu kesatuan", "Anggota berpengalaman; ketua kuat secara teknis dan manajemen proyek; rapat sering; tinjauan status teknis rutin; hubungan kerja baik; anggota ikut menetapkan sasaran"], ["Perencanaan formal", "Menyusun dan mengurutkan tugas; menganggarkan waktu, uang, sumber daya", "Memilih fase milestone; spesifikasi dari studi kelayakan; standar spesifikasi; proses persetujuan proyek"], ["Kendali formal", "Memantau kemajuan menuju penyelesaian tugas dan tujuan", "Disiplin mengendalikan dan membekukan desain; menemukan penyimpangan dari rencana; laporan status formal berkala"]], "w": [1.4, 2.1, 3.4]}, {"t": "h", "x": "Mengatasi resistensi pengguna"}, {"t": "table", "head": ["Teori", "Sumber resistensi", "Cara mengatasi"], "rows": [["People-oriented", "Faktor dalam diri pengguna", "Edukasi (pelatihan), paksaan (perintah, kebijakan), persuasi, partisipasi pengguna untuk membangun komitmen"], ["System-oriented", "Faktor bawaan desain sistem", "Edukasi, memperbaiki faktor manusia (antarmuka), partisipasi pengguna untuk desain lebih baik, modifikasi paket agar sesuai organisasi bila perlu"], ["Interaction", "Interaksi faktor manusia dan faktor sistem", "Selesaikan masalah organisasi, tata ulang insentif pengguna, tata ulang hubungan pengguna-perancang, dorong partisipasi"]], "w": [1.5, 2.0, 3.4]}, {"t": "box", "kind": "contoh", "title": "Satu gejala, tiga diagnosis", "x": ["Staf gudang menolak memakai pemindai barcode. People-oriented: mereka belum terlatih dan takut salah, solusinya pelatihan. System-oriented: pemindainya lambat dan layarnya sulit dibaca, solusinya perbaiki alat. Interaction: sistem membuat kesalahan tiap orang terlihat atasan sehingga mereka merasa diawasi, solusinya ubah cara penilaian kinerja dan libatkan mereka dalam perancangan."]}, {"t": "box", "kind": "langkah", "title": "Menangani resistensi pengguna", "x": ["Kenali gejalanya: tidak dipakai, dipakai setengah, atau diakali.", "Cari sumbernya: dari orang, dari desain sistem, atau dari interaksi keduanya.", "Pilih tindakan yang sesuai sumbernya (lihat tabel tiga teori).", "Libatkan pengguna dalam merancang perbaikannya.", "Pantau tingkat penggunaan dan kepuasan, lalu sesuaikan."]}, {"t": "box", "kind": "tips", "title": "Tips", "x": ["Pelatihan tidak menyelesaikan masalah yang sumbernya insentif. Jika sistem baru membuat kerja seseorang lebih berat tanpa manfaat baginya, ubah insentif atau prosesnya.", "Key user dari unit kerja sendiri lebih didengar rekan-rekannya daripada orang TI."]}, {"t": "h", "x": "Implementasi sebagai pembelajaran dan alih pengetahuan"}, {"t": "p", "x": "Implementasi adalah episode **pembelajaran** organisasi: TI menyimpan pengetahuan agar bisa diakses banyak pihak, organisasi menemukan kekurangan pada memorinya, dan terjadi **double-loop learning**, yaitu tidak hanya memperbaiki cara kerja tetapi juga mempertanyakan aturan dan asumsi di baliknya. **Alih pengetahuan** terjadi di antara orang-orang internal dan antara organisasi sumber (vendor, konsultan) dan organisasi pelaksana."}, {"t": "p", "x": "Pada sistem enterprise, vendor mengembangkan best practice dan menanamkannya ke dalam software. Organisasi pengguna lalu mengadopsi best practice itu ke dalam proses bisnisnya."}, {"t": "img", "f": "s12_p26.jpg", "cap": "Slide kuliah hlm. 26: proses alih best practice dari vendor ke organisasi pengguna"}, {"t": "h", "x": "Implementasi sebagai proses perubahan"}, {"t": "p", "x": "Perubahan yang dimungkinkan TI adalah **penyesuaian timbal balik antara teknologi, organisasi, dan proses bisnis** (Benjamin dan Levinson, 1993). Proses transisi tidak cukup dengan merencanakan dan mengimplementasikan; harus ada tahap **pelembagaan** (institutionalising) (Levinson, 1988). Slide memetakan tahap unfreezing, change, lalu adaptation, acceptance, routinisation, dan infusion pada masa penggunaan."}, {"t": "img", "f": "d9_proses_perubahan.png", "cap": "Diagram rangkuman: tiga tahap perubahan dan isinya"}, {"t": "img", "f": "s12_p27.jpg", "cap": "Slide kuliah hlm. 27: implementasi sebagai perubahan dan transisi yang dimungkinkan TI"}, {"t": "box", "kind": "langkah", "title": "Menyiapkan go-live", "x": ["Bangun kesadaran: jelaskan alasan perubahan dan manfaat bagi tiap kelompok pengguna.", "Petakan proses as-is dan to-be; perbarui SOP.", "Bersihkan dan migrasikan data; uji hasilnya.", "Latih pengguna dengan data dan kasus mereka sendiri.", "Tetapkan cara peralihan (langsung, paralel, atau bertahap) dan rencana cadangan.", "Dampingi pengguna pada minggu-minggu pertama.", "Setelah stabil, lembagakan: pantau pemakaian, kumpulkan usulan, perbaiki berkala."]}, {"t": "box", "kind": "aturan", "title": "Aturan implementasi", "x": ["Go-live bukan garis akhir; tahap pelembagaan harus direncanakan dan dibiayai.", "Teknologi, proses bisnis, dan organisasi disesuaikan bersama, bukan teknologinya saja.", "Pemilik proses bisnis ikut memiliki sistem; jangan diserahkan ke bagian TI saja."]}, {"t": "h", "x": "Implementasi ERP"}, {"t": "p", "x": "Alurnya: **keputusan adopsi**, lalu proses implementasi (perencanaan dan adaptasi, kemudian penggunaan dan pelembagaan) yang menghasilkan **intermediate outcome**, dan akhirnya **peningkatan efektivitas organisasi**."}, {"t": "ul", "x": ["**Keputusan adopsi** paket sebaiknya memenuhi: sesuai misi dan rencana strategis organisasi (**compatibility**) dan dinilai tidak terlalu rumit untuk diimplementasikan (**complexity**).", "**Intermediate outcome**: (1) lingkungan SI baru: mutu sistem teknis dan fungsional, mutu informasi, proses organisasi, pengaturan organisasi pendukung; (2) pengetahuan terkait: untuk memakai, memelihara, dan memodifikasi, dimiliki pengguna, key user, dan spesialis TI; (3) **kepemilikan** SI dan bisnis: orang bisnis merasa memiliki SI, orang TI merasa memiliki bisnis.", "**Dampak pada efektivitas**: jangka pendek berupa komunikasi dan koordinasi antardepartemen lebih baik, tugas lebih efisien, lingkungan keputusan dan pembelajaran lebih baik, pengawasan lebih baik, perencanaan dan kendali sumber daya lebih baik. Jangka panjang berupa profitabilitas dan daya saing."]}, {"t": "img", "f": "s12_p29.jpg", "cap": "Slide kuliah hlm. 29: kerangka implementasi ERP"}, {"t": "img", "f": "s12_p32.jpg", "cap": "Slide kuliah hlm. 32: kepemilikan SI dan bisnis: kemitraan anggota organisasi dan fungsi TI"}, {"t": "table", "head": ["Isu fase proyek", "Isu fase pasca-proyek"], "rows": [["Upaya penyelarasan (adaptasi)", "Upaya pelembagaan"], ["Membangun kesadaran dan menggerakkan perubahan", "Memfasilitasi upaya perbaikan: perbaikan sistem dan pembelajaran"], ["Pengembangan pengetahuan", ""]], "w": [3.4, 3.5]}, {"t": "p", "x": "Isu penting lain dari slide: adopsi best practice pengambilan keputusan sering rendah pengaruhnya pada keputusan berbasis data; **budaya** memengaruhi implementasi (jarak kekuasaan tinggi dan budaya mengikuti pemimpin); efek sofistikasi; dan kecenderungan **memperluas aplikasi** alih-alih memperbaiki sistem yang sudah ada."}, {"t": "box", "kind": "contoh", "title": "ERP di perusahaan manufaktur", "x": ["Perusahaan menetapkan go-live 1 Januari. Tiga bulan kemudian bagian gudang masih mencatat di Excel lalu mengunggah ke ERP seminggu sekali, sehingga stok di sistem selalu tertinggal dan bagian produksi tidak percaya angkanya. Secara proyek ERP \"selesai\", tetapi pelembagaan belum terjadi. Yang dibutuhkan: key user di gudang, SOP baru, dan atasan yang hanya menerima laporan dari ERP."]}, {"t": "box", "kind": "latihan", "title": "Refleksi", "x": ["Ingat satu sistem baru yang pernah diwajibkan kepadamu (aplikasi kampus, presensi, e-learning). Apa yang membuatmu menolak atau menerimanya? Petakan jawabanmu ke tiga teori resistensi. Biasanya penyebabnya jarang murni teknis."]}], "karier": {"intro": "Bagian tersulit dari transformasi digital di perusahaan bukan teknologinya, melainkan membuat orang mau memakainya. Lulusan TI sering ditempatkan tepat di titik ini karena memahami proses, manusia, dan sistem sekaligus.", "peran": [["Konsultan ERP / implementasi", "Fit-gap, konfigurasi, migrasi data, pelatihan, pendampingan go-live dan hypercare"], ["Change management specialist", "Analisis pemangku kepentingan, komunikasi, pelatihan, mengelola resistensi"], ["Key user / business process owner", "Wakil unit bisnis di proyek; menjadi rujukan rekan kerja setelah go-live"], ["IT business partner", "Menjembatani fungsi TI dan unit bisnis; membangun kepemilikan bersama"], ["Continuous improvement lead", "Memimpin perbaikan pasca-proyek agar manfaat sistem benar-benar terwujud"]], "skill": ["Manajemen perubahan (misalnya kerangka ADKAR atau Kotter)", "Merancang pelatihan dan SOP", "Pengetahuan modul ERP: produksi, persediaan, pembelian, penjualan, keuangan"]}, "kunci": [["CRM / SRM", "Sistem penghubung ke pelanggan (hilir) / pemasok (hulu)"], ["Federasi SI", "Kumpulan SI yang saling terintegrasi"], ["Integrasi eksternal", "Alat menghubungkan tim implementasi dengan pengguna"], ["Integrasi internal", "Alat menjaga kekompakan tim implementasi"], ["Resistensi pengguna", "Penolakan pengguna terhadap sistem baru"], ["Double-loop learning", "Belajar dengan mempertanyakan asumsi, bukan hanya memperbaiki tindakan"], ["Best practice", "Cara kerja terbaik yang ditanamkan vendor dalam paket"], ["Unfreezing-change-refreezing", "Tiga tahap perubahan"], ["Institutionalising", "Pelembagaan: sistem menjadi rutinitas"], ["Compatibility / complexity", "Dua pertimbangan keputusan adopsi paket"], ["Key user", "Pengguna kunci yang menguasai sistem dan membantu rekan"]], "kuis": [["Sebutkan lima ukuran keberhasilan SI.", "Tingkat penggunaan tinggi, kepuasan pengguna, sikap yang mendukung, tujuan tercapai, imbal hasil finansial."], ["Apa beda alat integrasi eksternal dan internal?", "Eksternal menghubungkan tim implementasi dengan pengguna di semua tingkat; internal memastikan tim implementasi bekerja kompak."], ["Sebutkan tiga teori resistensi pengguna.", "People-oriented, system-oriented, interaction theory."], ["Mengapa tahap pelembagaan penting?", "Karena manfaat baru muncul setelah sistem dipakai rutin; tanpa pelembagaan, pengguna kembali ke cara lama walau sistem sudah terpasang."], ["Apa dua pertimbangan keputusan adopsi paket ERP?", "Compatibility (sesuai misi dan rencana strategis) dan complexity (tidak terlalu rumit untuk diimplementasikan)."], ["Sebutkan tiga intermediate outcome implementasi ERP.", "Lingkungan SI baru, pengetahuan terkait (pakai, pelihara, modifikasi), serta kepemilikan SI dan bisnis."]]}, {"id": "pd", "no": "PD", "minggu": "Praktik", "judul": "Tutorial PowerDesigner: DFD dan ERD", "sumber": "Disusun dengan SAP PowerDesigner 16.7; contoh memakai kasus retail fashion dari Modul 6 dan 8", "ringkas": "Langkah demi langkah membuat DFD (Business Process Model) dan ERD (Conceptual Data Model) di PowerDesigner, sampai pemeriksaan model, pembuatan PDM, dan ekspor gambar.", "label": "TUTORIAL", "tujuan": ["Mengenali bagian-bagian jendela PowerDesigner", "Membuat diagram konteks dan DFD bertingkat", "Membuat ERD (CDM) lengkap dengan atribut, identifier, dan relasi", "Memeriksa model, menghasilkan PDM, dan mengekspor gambar"], "blocks": [{"t": "h", "x": "Model yang dipakai"}, {"t": "p", "x": "PowerDesigner menyimpan tiap jenis diagram sebagai **model** dengan ekstensi berkas berbeda. Untuk APSI cukup tiga."}, {"t": "table", "head": ["Kebutuhan", "Jenis model", "Ekstensi", "Catatan"], "rows": [["DFD", "Business Process Model (BPM) dengan process language Data Flow Diagram", ".bpm", "Proses, aliran data, data store, entitas eksternal"], ["ERD", "Conceptual Data Model (CDM)", ".cdm", "Entitas, atribut, relasi; belum ada kunci tamu"], ["Rancangan tabel", "Physical Data Model (PDM)", ".pdm", "Dihasilkan dari CDM; tabel, kolom, PK, FK untuk DBMS tertentu"]], "w": [1.2, 2.9, 0.8, 2.6]}, {"t": "box", "kind": "awas", "title": "Tentang gambar di tutorial ini", "x": ["Tangkapan layar jendela dan gambar diagram berasal dari PowerDesigner 16.7 di komputer ini, memakai berkas contoh di folder powerdesigner. Kotak dialog (New Model, Properties, Check Model) tidak ditangkap layarnya, sehingga dijelaskan lewat langkah tertulis. Nama menu bisa sedikit berbeda pada versi lain."]}, {"t": "h", "x": "Mengenal tampilan"}, {"t": "img", "f": "pd_ui_cdm.png", "cap": "Jendela PowerDesigner dengan model CDM terbuka"}, {"t": "table", "head": ["No", "Bagian", "Fungsi"], "rows": [["1", "Menu", "File, Edit, View, Model, Symbol, Tools. Hampir semua perintah tutorial ini ada di File, Model, Symbol, dan Tools"], ["2", "Toolbar", "Pintasan: New, Open, Save, Undo, Check Model, dan lainnya"], ["3", "Tab diagram dan kanvas", "Tempat menggambar. Garis kotak-kotak adalah batas halaman cetak"], ["4", "Toolbox", "Alat gambar. Isinya berubah mengikuti jenis diagram yang aktif"], ["5", "Output", "Pesan hasil Check Model dan proses generate"]], "w": [0.5, 1.8, 4.6]}, {"t": "p", "x": "Panel **Browser** (pohon isi model di sisi kiri) pada tangkapan layar ini sedang tertutup. Buka lewat menu View > Browser. Browser memudahkan berpindah antardiagram dan mencari objek."}, {"t": "table", "head": ["Pintasan", "Fungsi"], "rows": [["Ctrl+N", "Model baru"], ["Ctrl+S", "Simpan"], ["Klik kanan di kanvas", "Melepas alat yang sedang aktif dan kembali ke pointer"], ["Klik ganda pada simbol", "Membuka properti objek"], ["F2", "Mengganti nama langsung pada simbol"], ["F4", "Check Model"], ["F6 / F7", "Perbesar / perkecil"], ["F8", "Tampilan menyeluruh"], ["Ctrl+A", "Pilih semua simbol"], ["Ctrl+Z", "Batalkan"]], "w": [2.2, 4.7]}, {"t": "box", "kind": "aturan", "title": "Aturan dasar memakai Toolbox", "x": ["Klik alat sekali, lalu klik di kanvas untuk tiap objek yang ingin dibuat.", "Alat tetap aktif sampai kamu klik kanan. Lupa klik kanan adalah penyebab paling umum objek bertambah tanpa sengaja.", "Alat penghubung (flow, relationship) dipakai dengan menyeret dari simbol asal ke simbol tujuan.", "Arahkan kursor ke ikon untuk melihat nama alatnya."]}, {"t": "h", "x": "Bagian A: membuat DFD"}, {"t": "box", "kind": "langkah", "title": "A1. Membuat model DFD", "x": ["Pilih File > New Model.", "Pilih jenis model Business Process Model dan diagram Business Process Diagram.", "Pada pilihan Process language, pilih **Data Flow Diagram**. Inilah yang memunculkan alat DFD.", "Isi Model name, misalnya \"DFD Retail Fashion\", lalu OK.", "Simpan dengan Ctrl+S; berkasnya berekstensi .bpm."]}, {"t": "img", "f": "pd_ui_bpm.png", "cap": "Jendela PowerDesigner dengan model DFD; Toolbox memuat kelompok Data Flow Diagram dan pojok kanan bawah menunjukkan bahasa proses yang aktif"}, {"t": "table", "head": ["Alat DFD", "Dipakai untuk", "Simbol pada PowerDesigner"], "rows": [["Process", "Proses", "Kotak bersudut tumpul dengan nomor di bagian atas (gaya Gane-Sarson)"], ["Flow / Resource Flow", "Aliran data", "Panah; aliran ke atau dari data store disebut resource flow"], ["Data Store", "Simpanan data", "Kotak terbuka dengan nomor di kiri"], ["External Entity", "Entitas eksternal", "Ikon orang atau kotak, tergantung pengaturan tampilan"]], "w": [1.7, 1.6, 3.6]}, {"t": "box", "kind": "langkah", "title": "A2. Menggambar diagram konteks", "x": ["Klik alat Process, klik di tengah kanvas, lalu klik kanan.", "Klik ganda proses itu; isi Name dengan nama sistem, misalnya \"SI Retail Fashion\".", "Klik alat External Entity; klik di kanvas sekali untuk tiap pihak luar; klik kanan.", "Beri nama tiap entitas (klik ganda atau F2).", "Klik alat Flow; seret dari entitas ke proses untuk aliran masuk, dari proses ke entitas untuk aliran keluar.", "Klik ganda tiap aliran dan isi Name dengan nama datanya.", "Rapikan posisi simbol dengan menyeretnya."]}, {"t": "img", "f": "pd_export_konteks.png", "cap": "Diagram konteks SI retail fashion hasil PowerDesigner (diekspor dari berkas DFD Retail Fashion.bpm)"}, {"t": "box", "kind": "langkah", "title": "A3. Merinci proses menjadi level berikutnya", "x": ["Klik kanan proses, pilih **Decompose Process**. Proses menjadi proses komposit (muncul tanda + pada simbol) dan PowerDesigner membuat diagram anak.", "Buka diagram anak dengan Ctrl + klik ganda pada proses, atau lewat Browser.", "Di diagram anak, buat subproses dengan alat Process.", "Buat data store dengan alat Data Store.", "Entitas eksternal yang terhubung ke proses induk biasanya sudah ikut dibawa ke diagram anak; pindahkan ke posisi yang enak dibaca.", "Hubungkan dengan Flow. Untuk hubungan proses dengan data store, tentukan aksesnya pada properti aliran (baca, buat, ubah, hapus).", "Ulangi Decompose Process pada subproses yang masih rumit untuk membuat level 1, 2, dan seterusnya.", "Kembali ke diagram induk lewat Browser (klik ganda nama diagramnya)."]}, {"t": "img", "f": "pd_export_dfd0.png", "cap": "DFD level 0 hasil PowerDesigner. Nama aliran belum ditampilkan; aktifkan lewat Tools > Display Preferences. Versi bernama ada di rangkuman Materi 6"}, {"t": "box", "kind": "aturan", "title": "Aturan dan hal yang perlu tahu", "x": ["PowerDesigner memberi nomor otomatis. Karena proses puncak bernomor 1, anaknya tampil sebagai 1.1, 1.2, dan seterusnya. Ubah lewat properti proses (Number ID) bila dosen meminta proses puncak bernomor 0.", "Satu objek bisa tampil di beberapa diagram. Menghapus simbol berbeda dengan menghapus objek; saat ditanya, pilih hapus simbol saja jika objeknya masih dipakai di diagram lain.", "Jangan menggambar ulang entitas yang sama dengan alat External Entity; seret objeknya dari Browser agar tetap satu objek.", "Data store tidak boleh dihubungkan langsung ke entitas eksternal; PowerDesigner mengikuti aturan DFD yang sama dengan di kelas."]}, {"t": "box", "kind": "tips", "title": "Tips", "x": ["Jika nama aliran tidak tampil, buka Tools > Display Preferences, cari kategori Flow dan Resource Flow, lalu aktifkan pilihan yang menampilkan nama. Terapkan ke semua simbol.", "Panah bolak-balik antara dua simbol akan bertumpuk. Klik garisnya lalu seret titik tengahnya agar melengkung, atau tekan Ctrl sambil klik garis untuk menambah titik belok.", "Gunakan Symbol > Auto-Layout untuk tata letak awal, lalu rapikan manual.", "Ganti tampilan entitas dari ikon orang menjadi kotak lewat Display Preferences bila ingin sama dengan notasi di slide."]}, {"t": "h", "x": "Bagian B: membuat ERD (CDM)"}, {"t": "box", "kind": "langkah", "title": "B1. Membuat model CDM", "x": ["Pilih File > New Model.", "Pilih Conceptual Data Model dan diagram Conceptual Diagram.", "Isi Model name, misalnya \"CDM Retail Fashion\", lalu OK.", "Buka Tools > Model Options. Pada bagian Notation pilih notasi yang diminta dosen (Entity/Relationship, Barker, IDEF1X, atau lainnya).", "Masih di Model Options, perhatikan pilihan data item **Unique code** dan **Allow reuse** (lihat aturan di bawah).", "Simpan; berkasnya berekstensi .cdm."]}, {"t": "box", "kind": "langkah", "title": "B2. Membuat entitas dan atribut", "x": ["Klik alat Entity, klik di kanvas untuk tiap entitas, lalu klik kanan.", "Klik ganda entitas. Pada tab General isi Name (misalnya PELANGGAN); Code terisi otomatis.", "Buka tab Attributes. Tiap baris adalah satu atribut: isi Name dan pilih Data Type.", "Centang kolom **P** (Primary Identifier) pada atribut kunci. Kolom **M** (Mandatory) ikut tercentang.", "Centang M untuk atribut lain yang wajib diisi.", "Klik OK. Ulangi untuk entitas lain."]}, {"t": "table", "head": ["Data type", "Arti", "Contoh pemakaian"], "rows": [["Integer", "Bilangan bulat", "no_pelanggan, jumlah_stok"], ["Variable characters (n)", "Teks dengan panjang maksimum n", "nama_barang, alamat"], ["Characters (n)", "Teks panjang tetap", "kode dengan panjang pasti"], ["Date / Date & Time", "Tanggal / tanggal dan jam", "tanggal_pesanan"], ["Money (p,s) atau Decimal (p,s)", "Angka dengan desimal", "harga, total_bayar"]], "w": [2.2, 2.4, 2.3]}, {"t": "box", "kind": "langkah", "title": "B3. Membuat relasi", "x": ["Klik alat Relationship.", "Seret dari entitas pertama ke entitas kedua, lalu klik kanan.", "Klik ganda garis relasi. Pada tab General isi Name dengan kata kerja (misalnya \"membuat\").", "Buka tab Cardinalities. Pilih jenisnya: One-One, One-Many, Many-One, atau Many-Many.", "Untuk tiap arah, atur **Mandatory** (wajib atau tidak) dan kardinalitas minimum-maksimum, misalnya 0,n dan 1,1.", "Untuk entitas detail yang kuncinya bergantung pada induk (misalnya DETAIL_PESANAN terhadap PESANAN_ONLINE), centang **Dependent** pada arah dari detail ke induk.", "Klik OK dan periksa simbol di ujung garis."]}, {"t": "img", "f": "pd_export_cdm.png", "cap": "ERD (CDM) SI retail fashion hasil PowerDesigner, 13 entitas dan 16 relasi, notasi Barker. Tanda # = identifier, o = atribut opsional"}, {"t": "box", "kind": "aturan", "title": "Aturan CDM di PowerDesigner", "x": ["**Jangan menulis kunci tamu (foreign key) sebagai atribut.** Di CDM, hubungan antarentitas cukup dinyatakan lewat relasi. Kolom FK dibuat otomatis saat PDM dihasilkan. Menulisnya sendiri membuat kolom ganda.", "Secara bawaan, nama data item harus unik di seluruh model (Unique code). Karena itu contoh memakai nama seperti nama_pelanggan dan nama_supplier, bukan \"nama\" di dua entitas.", "Jika ingin memakai nama atribut yang sama di beberapa entitas, matikan Unique code atau biarkan Allow reuse aktif dengan sadar bahwa atribut itu menjadi satu data item bersama.", "Relasi Many-Many boleh digambar langsung; PowerDesigner membuat tabel penghubung saat generate PDM. Jika relasinya punya atribut (jumlah, tanggal), buat entitas tersendiri dengan relasi Dependent seperti pada contoh.", "Tiap entitas sebaiknya punya identifier. Entitas detail pada contoh tidak punya identifier sendiri karena kuncinya diwarisi dari dua induk lewat relasi Dependent."]}, {"t": "box", "kind": "tips", "title": "Tips", "x": ["Beri nama entitas dengan huruf besar dan atribut dengan huruf kecil agar mudah dibedakan.", "Arah menyeret relasi menentukan Entity 1 dan Entity 2. Biasakan menyeret dari sisi \"satu\" ke sisi \"banyak\" agar tab Cardinalities mudah dibaca.", "Sembunyikan tipe data lewat Tools > Display Preferences bila diagram terlalu lebar.", "Simpan berkala; PowerDesigner membuat berkas cadangan (.cdb, .bpb) di folder yang sama."]}, {"t": "h", "x": "Bagian C: memeriksa model dan membuat PDM"}, {"t": "box", "kind": "langkah", "title": "C1. Check Model", "x": ["Tekan F4 atau pilih Tools > Check Model.", "Biarkan semua pemeriksaan tercentang, klik OK.", "Baca hasilnya di panel Output atau Result List. **Error** harus diperbaiki; **warning** sebaiknya ditinjau.", "Klik ganda baris pesan untuk melompat ke objek yang bermasalah.", "Perbaiki, lalu ulangi sampai tidak ada error."]}, {"t": "table", "head": ["Jenis pesan (kurang lebih)", "Penyebab", "Perbaikan"], "rows": [["Entity: existence of identifiers", "Entitas tidak punya identifier", "Centang P pada atribut kunci, atau jadikan relasinya Dependent"], ["Entity: existence of attributes", "Entitas tanpa atribut", "Tambah atribut, atau hapus entitas bila memang tidak perlu"], ["Data item: not used", "Atribut pernah dibuat lalu dihapus dari entitas", "Hapus data item lewat Model > Data Items"], ["Relationship: reflexive / identifier link", "Relasi Dependent membentuk lingkaran", "Periksa arah Dependent"], ["Process: missing input or output flow", "Proses tanpa masukan atau keluaran (DFD)", "Tambahkan aliran yang kurang"]], "w": [2.4, 2.2, 2.3]}, {"t": "box", "kind": "langkah", "title": "C2. Menghasilkan PDM dari CDM", "x": ["Buka model CDM yang sudah lolos Check Model.", "Pilih Tools > Generate Physical Data Model (Ctrl+Shift+P).", "Pilih Generate new Physical Data Model, lalu pilih DBMS, misalnya MySQL 5.0.", "Isi nama model, klik OK.", "PowerDesigner membuka PDM baru: entitas menjadi tabel, atribut menjadi kolom, identifier menjadi primary key, relasi menjadi reference dengan foreign key.", "Periksa hasilnya, terutama kunci gabungan pada tabel detail.", "Untuk skrip SQL, pada PDM pilih Database > Generate Database (Ctrl+G), tentukan folder dan nama berkas .sql, lalu OK."]}, {"t": "p", "x": "Hasil yang diharapkan untuk beberapa tabel pada contoh (tanda * = primary key, FK = foreign key):"}, {"t": "table", "head": ["Tabel", "Kolom"], "rows": [["PELANGGAN", "no_pelanggan*, nama_pelanggan, alamat_pelanggan, kode_pos, telp_pelanggan"], ["PESANAN_ONLINE", "no_pesanan*, no_pelanggan (FK), tanggal_pesanan, jenis_kartu, no_kartu"], ["DETAIL_PESANAN", "no_pesanan* (FK), kode_barang* (FK), kode_toko (FK), jumlah_dipesan, tanggal_kirim"], ["STOK", "kode_toko* (FK), kode_barang* (FK), jumlah_stok"], ["DELIVERY_ORDER", "no_do*, no_po (FK), tanggal_kirim_do, tanggal_terima"]], "w": [1.8, 5.1]}, {"t": "box", "kind": "awas", "title": "Catatan", "x": ["Tabel di atas adalah hasil yang seharusnya muncul menurut aturan generate (FK ditambahkan ke sisi \"banyak\"; relasi Dependent menjadikan FK bagian dari PK). Langkah generate PDM belum dijalankan untuk tutorial ini, jadi cocokkan dengan hasil di komputermu."]}, {"t": "h", "x": "Bagian D: mengekspor gambar untuk laporan"}, {"t": "box", "kind": "langkah", "title": "D1. Ekspor diagram", "x": ["Buka diagram yang ingin diekspor.", "Tekan Ctrl+A untuk memilih semua simbol (atau pilih sebagian).", "Pilih Edit > Export Image.", "Pilih format PNG atau JPEG untuk laporan; EMF atau SVG bila ingin tetap tajam saat diperbesar.", "Simpan, lalu sisipkan ke dokumen."]}, {"t": "box", "kind": "tips", "title": "Tips", "x": ["Alternatif cepat: Ctrl+A, Ctrl+C, lalu tempel langsung ke Word.", "Sebelum ekspor, matikan garis batas halaman lewat Tools > Display Preferences bila mengganggu.", "Untuk dokumentasi lengkap (daftar entitas, atribut, relasi), pakai menu Report."]}, {"t": "h", "x": "Berkas contoh"}, {"t": "table", "head": ["Berkas", "Isi"], "rows": [["powerdesigner/DFD Retail Fashion.bpm", "Diagram konteks dan DFD level 0 (proses puncak sudah didekomposisi)"], ["powerdesigner/CDM Retail Fashion.cdm", "ERD 13 entitas dan 16 relasi, lengkap dengan atribut dan identifier"]], "w": [3.2, 3.7]}, {"t": "p", "x": "Buka be <script>
const D = window.__DATA__, IMG = window.__IMG__;
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const src = f => encodeURI(IMG[f] || f);
const KIND = {contoh:'Contoh', tips:'Tips', awas:'Perhatikan', karier:'Karier', langkah:'Langkah-langkah', aturan:'Aturan', latihan:'Coba sendiri'};
const store = { get(){ try { return JSON.parse(localStorage.getItem('apsi-selesai') || '{}') } catch(e){ return {} } },
                set(v){ try { localStorage.setItem('apsi-selesai', JSON.stringify(v)) } catch(e){} } };
let done = store.get(), filter = 'semua';
const count = (m, fn) => m.blocks.filter(fn).length;
const label = m => m.id === 'pd' ? 'Tutorial' : 'Materi ' + m.no;

function nav(cur){
  $('#nav').innerHTML = `<a href="#beranda" ${cur==='beranda'?'aria-current="page"':''}><span class="n">00</span><span>Beranda</span><span></span></a><hr>` +
    D.materi.map(m => `<a href="#${m.id}" ${cur===m.id?'aria-current="page"':''}><span class="n">${m.id==='pd'?'PD':String(m.no).padStart(2,'0')}</span><span>${esc(m.judul)}</span><span class="ok ${done[m.id]?'on':''}" title="${done[m.id]?'Sudah dipelajari':'Belum ditandai'}"></span></a>`).join('') +
    `<hr><a href="#kamus" ${cur==='kamus'?'aria-current="page"':''}><span class="n">Aa</span><span>Kamus istilah</span><span></span></a>`;
}
function block(b){
  if (b.t==='h') return `<h2 id="s-${slug(b.x)}" data-k="h">${md(b.x)}</h2>`;
  if (b.t==='p') return `<p data-k="teks">${md(b.x)}</p>`;
  if (b.t==='ul'||b.t==='ol') return `<${b.t} data-k="teks">${b.x.map(i=>`<li>${md(i)}</li>`).join('')}</${b.t}>`;
  if (b.t==='table') return `<div class="tw" data-k="teks"><table><thead><tr>${b.head.map(h=>`<th>${md(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if (b.t==='img') return `<figure data-k="gambar" class="${b.f.startsWith('s')?'slide':''}"><button type="button" data-zoom="${esc(b.f)}" aria-label="Perbesar gambar"><img loading="lazy" src="${src(b.f)}" alt="${esc(b.cap)}"></button><figcaption>${md(b.cap)}</figcaption></figure>`;
  if (b.t==='box'){
    const list = b.kind==='langkah' ? 'ol' : ((b.kind==='aturan' || (b.kind==='tips' && b.x.length>1)) ? 'ul' : null);
    const body = list ? `<${list}>${b.x.map(i=>`<li>${md(i)}</li>`).join('')}</${list}>` : b.x.map(i=>`<p>${md(i)}</p>`).join('');
    return `<section class="box b-${b.kind}" data-k="${b.kind}"><span class="k">${KIND[b.kind]}</span><h3>${md(b.title)}</h3>${body}</section>`;
  }
  return '';
}
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const FILTERS = [['semua','Semua'],['langkah','Langkah & aturan'],['contoh','Contoh'],['gambar','Gambar']];
function applyFilter(){
  document.querySelectorAll('#isi [data-k]').forEach(el => {
    const k = el.dataset.k;
    const show = filter==='semua' || k==='h' || (filter==='langkah' && (k==='langkah'||k==='aturan'||k==='tips')) || (filter==='contoh' && (k==='contoh'||k==='latihan')) || (filter==='gambar' && k==='gambar');
    el.hidden = !show;
  });
  document.querySelectorAll('[data-f]').forEach(b => b.setAttribute('aria-pressed', b.dataset.f===filter));
}
function home(){
  const all = D.materi, n = all.length, nd = all.filter(m=>done[m.id]).length;
  const tot = fn => all.reduce((a,m)=>a+count(m,fn),0);
  $('#main').innerHTML = `<div class="page">
    <header><div class="eyebrow">${esc(D.kursus.kode)} · ${esc(D.kursus.nama)}</div><h1>Rangkuman APSI</h1>
    <p class="lede">Sembilan materi kuliah dan satu tutorial PowerDesigner, diringkas dengan contoh, langkah kerja, aturan, dan kaitannya dengan dunia kerja.</p></header>
    <div class="stats">
      <div class="stat"><b>${n}</b><span>bagian (9 materi + 1 tutorial)</span></div>
      <div class="stat"><b>${tot(b=>b.t==='box'&&b.kind==='langkah')}</b><span>panduan langkah</span></div>
      <div class="stat"><b>${tot(b=>b.t==='img')}</b><span>gambar dan diagram</span></div>
      <div class="stat"><b>${all.reduce((a,m)=>a+m.kuis.length,0)}</b><span>soal kuis</span></div>
    </div>
    <div><div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px"><span>Progres belajarmu (tersimpan di perangkat ini)</span><span>${nd} dari ${n}</span></div><div class="bar"><i style="width:${nd/n*100}%"></i></div></div>
    <h2>Peta materi</h2>
    <figure><button type="button" data-zoom="d0_peta_materi.png" aria-label="Perbesar peta materi"><img src="${src('d0_peta_materi.png')}" alt="Peta materi APSI pada siklus pengembangan sistem"></button><figcaption>Setiap materi menempel pada satu atau beberapa fase siklus pengembangan sistem.</figcaption></figure>
    <h2>Semua bagian</h2>
    <div class="cards">${all.map(m=>`<a class="card" href="#${m.id}"><div class="top"><span>${label(m).toUpperCase()}</span><span>${esc(m.minggu)}</span></div><h3>${esc(m.judul)}</h3><p>${esc(m.ringkas)}</p>
      <div class="meta"><span class="pill">${count(m,b=>b.t==='box'&&b.kind==='langkah')} langkah</span><span class="pill">${count(m,b=>b.t==='img')} gambar</span><span class="pill">${m.kuis.length} kuis</span>${done[m.id]?'<span class="pill done">sudah dipelajari</span>':''}</div></a>`).join('')}</div>
    <p class="note">${esc(D.kursus.catatan)} Versi Word tiap materi ada di folder <strong>Rangkuman APSI 2025/docs</strong>.</p>
  </div>`;
}
function materi(m){

      <div class="tw" data-k="teks"><table><thead><tr><th>Istilah</th><th>Arti singkat</th></tr></thead><tbody>${m.kunci.map(r=>`<tr><td>${md(r[0])}</td><td>${md(r[1])}</td></tr>`).join('')}</tbody></table></div>
      <h2 id="s-kuis" data-k="h">Kuis cepat</h2>
      <div class="quiz" data-k="teks">${m.kuis.map((q,i)=>`<details><summary>${i+1}. ${md(q[0])}</summary><p>${md(q[1])}</p></details>`).join('')}</div>
    </div></div>`;
  $('#mark').onclick = e => { done[m.id] = !done[m.id]; store.set(done); const b=e.currentTarget; b.setAttribute('aria-pressed', !!done[m.id]); b.textContent = done[m.id]?'Sudah dipelajari':'Tandai sudah dipelajari'; nav(m.id); };
  applyFilter();
}
function kamus(){
  const rows = []; D.materi.forEach(m => m.kunci.forEach(k => rows.push([k[0], k[1], m])));
  rows.sort((a,b)=>a[0].localeCompare(b[0],'id'));
  $('#main').innerHTML = `<div class="page"><header><div class="eyebrow">Semua materi</div><h1>Kamus istilah</h1><p class="lede">${rows.length} istilah dari seluruh rangkuman.</p></header>
    <label for="cari" class="src">Cari istilah atau arti</label><input id="cari" class="search" type="search" placeholder="mis. balancing, jalur kritis, ERP" autocomplete="off">
    <div class="tw"><table><thead><tr><th>Istilah</th><th>Arti singkat</th><th>Materi</th></tr></thead><tbody id="kb"></tbody></table></div><p class="src" id="kn"></p></div>`;
  const draw = q => { const f = rows.filter(r => (r[0]+' '+r[1]).toLowerCase().includes(q.toLowerCase()));
    $('#kb').innerHTML = f.map(r=>`<tr><td>${md(r[0])}</td><td>${md(r[1])}</td><td><a href="#${r[2].id}" style="color:var(--teal)">${label(r[2])}</a></td></tr>`).join('');
    $('#kn').textContent = f.length ? f.length + ' istilah ditampilkan' : 'Tidak ada istilah yang cocok. Coba kata lain.'; };
  $('#cari').oninput = e => draw(e.target.value); draw('');
}
function route(){
  const h = (location.hash || '#beranda').slice(1);
  const m = D.materi.find(x => x.id === h);
  filter = 'semua';
  if (m) materi(m); else if (h==='kamus') kamus(); else home();
  nav(m ? m.id : (h==='kamus' ? 'kamus' : 'beranda'));
  window.scrollTo(0,0);
}
document.addEventListener('click', e => {
  const f = e.target.closest('[data-f]'); if (f){ filter = f.dataset.f; applyFilter(); return; }
  const g = e.target.closest('[data-go]'); if (g){ e.preventDefault(); if (filter!=='semua'){ filter='semua'; applyFilter(); } const t = document.getElementById(g.dataset.go); if (t) t.scrollIntoView({block:'start'}); return; }
  const z = e.target.closest('[data-zoom]'); if (z){ const lb = $('#lb'); $('#lbimg').src = src(z.dataset.zoom); lb.hidden = false; $('#lbx').focus(); return; }
  if (e.target.closest('#lb')){ $('#lb').hidden = true; }
});
document.addEventListener('keydown', e => { if (e.key==='Escape') $('#lb').hidden = true; });
window.addEventListener('hashchange', route);
route();
</script>
