<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{height:100%;margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Rangkuman APSI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
/* Tata letak: rel navigasi materi di kiri, lembar baca di kanan; di ponsel rel menjadi pita gulir di atas. */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --ink:#1A2733; --muted:#5A6978; --line:#D5DEE7;
  --navy:#1B3A5C; --teal:#16756F; --amber:#9A6412; --red:#A33E33; --violet:#5F4487;
  --navy-bg:#E3EBF4; --teal-bg:#E0F2F0; --amber-bg:#FBEFD9; --red-bg:#F8E4E1; --violet-bg:#EEE8F6; --grey-bg:#E9EEF3;
  --paper:#FFFFFF; --accent:#16756F; --on-accent:#FFFFFF;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1720; --surface:#17222E; --ink:#E6EDF3; --muted:#9BABBA; --line:#2B3B4B;
  --navy:#9CC2EC; --teal:#5FD0C6; --amber:#E9B867; --red:#F0938A; --violet:#C3A8EA;
  --navy-bg:#1C2D40; --teal-bg:#143230; --amber-bg:#35290F; --red-bg:#3A1E1B; --violet-bg:#2A2140; --grey-bg:#1E2A36;
  --paper:#FFFFFF; --accent:#5FD0C6; --on-accent:#0F1720; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1720; --surface:#17222E; --ink:#E6EDF3; --muted:#9BABBA; --line:#2B3B4B;
  --navy:#9CC2EC; --teal:#5FD0C6; --amber:#E9B867; --red:#F0938A; --violet:#C3A8EA;
  --navy-bg:#1C2D40; --teal-bg:#143230; --amber-bg:#35290F; --red-bg:#3A1E1B; --violet-bg:#2A2140; --grey-bg:#1E2A36;
  --paper:#FFFFFF; --accent:#5FD0C6; --on-accent:#0F1720; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
h1,h2,h3,p,li,td,figcaption{overflow-wrap:anywhere}
.rail,.nav{min-width:0}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:22px 14px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto}
.brand{padding:0 8px 16px}
.brand b{display:block;font-size:19px;letter-spacing:-.01em;color:var(--navy)}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:grid;grid-template-columns:30px 1fr 18px;gap:8px;align-items:center;padding:8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.3}
.nav a:hover{background:var(--grey-bg)}
.nav a[aria-current="page"]{background:var(--navy-bg);color:var(--navy);font-weight:700}
.nav a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.nav .ok{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.nav .ok.on{background:var(--teal);border-color:var(--teal)}
.nav hr{border:0;border-top:1px solid var(--line);margin:8px 4px;width:auto}
main{padding-block:28px 72px;padding-inline:clamp(16px,4vw,48px);min-width:0}
.page{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
h1{font-size:clamp(26px,4.2vw,38px);line-height:1.12;letter-spacing:-.02em;margin:4px 0 8px;color:var(--navy);text-wrap:balance}
h2{font-size:21px;line-height:1.25;margin:18px 0 0;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--navy);text-wrap:balance;scroll-margin-top:70px}
h3{font-size:15px;margin:0}
p{margin:0;max-width:72ch}
.lede{font-size:17px;color:var(--ink);max-width:66ch}
.src{font-size:12.5px;color:var(--muted)}
ul,ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px;max-width:72ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--navy)}
.stat span{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--grey-bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.card h3{font-size:16.5px;line-height:1.25;color:var(--navy)}
.card p{font-size:13.5px;color:var(--muted)}
.card .meta{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;font-size:11.5px}
.pill{padding:2px 8px;border-radius:99px;background:var(--grey-bg);color:var(--muted);font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.pill.done{background:var(--teal-bg);color:var(--teal)}
.goals{background:var(--grey-bg);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.goals h3{color:var(--navy)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:5;border-bottom:1px solid var(--line)}
.tools .lbl{font-size:12.5px;color:var(--muted);margin-right:2px}
button{font:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:99px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.chip.mark{margin-left:auto}
.chip.mark[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:12.5px;color:var(--navy);text-decoration:none;border:1px solid var(--line);padding:3px 10px;border-radius:6px;background:var(--surface)}
.box{border-left:4px solid var(--c);background:var(--b);border-radius:0 10px 10px 0;padding:12px 16px;display:flex;flex-direction:column;gap:7px;min-width:0}
.box .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--c);font-weight:600}
.box h3{font-size:15px}
.box p,.box li{font-size:14.2px}
.box ol,.box ul{gap:4px}
.b-contoh{--c:var(--teal);--b:var(--teal-bg)} .b-tips{--c:var(--amber);--b:var(--amber-bg)} .b-awas{--c:var(--red);--b:var(--red-bg)}
.b-karier,.b-langkah{--c:var(--navy);--b:var(--navy-bg)} .b-aturan{--c:var(--violet);--b:var(--violet-bg)} .b-latihan{--c:var(--muted);--b:var(--grey-bg)}
figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
figure button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px;max-width:100%;display:block}
figure img{display:block;max-width:100%;height:auto;max-height:560px}
figure.slide img{max-height:380px}
figcaption{font-size:12.5px;color:var(--muted);text-align:center;max-width:70ch}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:460px}
th{background:var(--navy-bg);color:var(--navy);text-align:left;font-size:12.5px;padding:8px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:600}
.quiz{display:flex;flex-direction:column;gap:8px}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 14px}
summary{cursor:pointer;font-weight:600;font-size:14.5px}
details p{margin-top:8px;color:var(--muted);font-size:14.2px}
.search{width:100%;max-width:420px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 14px}
.lb{position:fixed;inset:0;background:rgba(10,16,22,.86);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.lb img{max-width:100%;max-height:100%;background:var(--paper);border-radius:8px;padding:8px}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;border:0;border-radius:99px;padding:8px 14px;background:#FFFFFF;color:#1A2733}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  .brand{padding:0 0 8px}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav a{grid-template-columns:auto auto auto;white-space:nowrap;border:1px solid var(--line);padding:6px 10px}
  .nav hr{display:none}
  .tools{top:env(safe-area-inset-top,0px)}
}
</style>

<script>window.__DATA__ = {"kursus": {"kode": "TI3006", "nama": "Analisis dan Perancangan Sistem Informasi", "dosen": "Prof. Dr. Rajesri Govindaraju dan tim pengajar", "catatan": "Folder Slide Materi 2025 berisi 11 berkas PDF. Materi minggu 11 (Manajemen dan Tata Kelola IT/IS) tercantum di silabus tetapi slidenya tidak ada di folder, sehingga belum dirangkum."}, "materi": [{"id": "m1", "no": 1, "minggu": "Minggu 1", "judul": "Sistem Informasi dan Pengambilan Keputusan", "sumber": "1-Sistem-Informasi-dan-Pengambilan-Keputusan.pdf (36 slide)", "ringkas": "Apa itu sistem informasi, bedanya data, informasi, dan pengetahuan, serta mengapa tiap tingkat manajemen butuh jenis SI yang berbeda.", "tujuan": ["Menjelaskan mengapa mahasiswa Teknik Industri perlu belajar APSI", "Membedakan data, informasi, dan pengetahuan", "Menyebutkan enam komponen sistem informasi", "Mengaitkan jenis keputusan (terstruktur sampai tidak terstruktur) dengan tingkat manajemen dan jenis SI", "Menjelaskan integrasi internal (ERP) dan eksternal (enterprise system)"], "blocks": [{"t": "h", "x": "Mengapa anak TI belajar APSI"}, {"t": "p", "x": "Definisi Teknik Industri (IIE, 1991) menyebut perancangan, perbaikan, dan instalasi **sistem terintegrasi** yang terdiri dari manusia, material, **informasi**, peralatan, dan energi. Informasi disebut sejajar dengan material dan mesin. Artinya merancang aliran informasi adalah pekerjaan inti seorang insinyur industri, bukan urusan orang IT saja."}, {"t": "p", "x": "Dalam sistem kerja modern, hampir semua proses perencanaan dan eksekusi industri dijalankan lewat sistem informasi: ERP, SCM, Manufacturing Execution System (MES), dan e-business. Orang yang paham proses bisnis sekaligus paham cara merancang SI menjadi penghubung antara lantai produksi dan tim teknologi."}, {"t": "box", "kind": "tips", "title": "Cara cepat menangkap idenya", "x": ["Bayangkan kamu memesan makanan lewat aplikasi. Satu klik itu sampai ke restoran, kurir, bank, kamu sendiri, dan tim promosi. Satu transaksi yang mengalir ke banyak pihak, itulah sistem informasi."]}, {"t": "h", "x": "Data, informasi, dan pengetahuan"}, {"t": "ul", "x": ["**Data**: fakta mentah yang belum diolah. Kumpulan hasil pengamatan.", "**Informasi**: data yang sudah dikumpulkan, diatur, dan ditafsirkan sehingga punya nilai tambah.", "**Pengetahuan**: pemahaman atas sekumpulan informasi dan cara memakainya untuk tugas atau keputusan tertentu."]}, {"t": "p", "x": "Analogi slide: data adalah batu bata dan semen, informasi adalah rumah yang sudah jadi. Tumpukan bata tidak bisa ditinggali; data yang tidak diolah tidak berguna bagi manajer."}, {"t": "img", "f": "d1_data_informasi.png", "cap": "Diagram rangkuman: rantai data, informasi, pengetahuan, keputusan pada kantin kampus"}, {"t": "img", "f": "s1_p23.jpg", "cap": "Slide kuliah hlm. 23: hierarki informasi"}, {"t": "box", "kind": "contoh", "title": "Contoh di pabrik", "x": ["Sensor mencatat suhu mesin setiap detik (data). Rata-rata suhu per shift dan grafik tren (informasi). Teknisi tahu bahwa kenaikan 5 derajat selama tiga hari biasanya mendahului kerusakan bearing (pengetahuan). Jadwal perawatan dimajukan (keputusan)."]}, {"t": "h", "x": "Definisi dan komponen sistem informasi"}, {"t": "p", "x": "Motiwalla dan Thompson (2012): sistem informasi adalah **konfigurasi unik antara sumber daya TI dan proses organisasi**, di mana sumber daya TI dipakai untuk mendukung proses organisasi tertentu. O'Brien (1999): kombinasi terorganisasi dari manusia, hardware, software, jaringan komunikasi, dan sumber daya data yang mengumpulkan, mengubah, dan menyebarkan informasi."}, {"t": "p", "x": "Bedakan dua istilah yang sering tertukar. **Teknologi informasi (TI)** adalah gabungan teknologi komputer (hardware, software) dan telekomunikasi. **Sistem informasi (SI)** lebih luas: TI ditambah manusia, data, dan proses yang bekerja bersama."}, {"t": "table", "head": ["Komponen", "Penjelasan", "Contoh pada sistem presensi kuliah"], "rows": [["Hardware", "Perangkat fisik untuk menerima, mengolah, menampilkan data", "Ponsel mahasiswa, server kampus"], ["Software", "Program yang membuat hardware bisa mengolah data", "Aplikasi presensi, sistem operasi"], ["Database", "Kumpulan berkas atau tabel berisi data yang saling terkait", "Tabel mahasiswa, jadwal, kehadiran"], ["Network", "Penghubung yang membuat komputer bisa berbagi sumber daya", "Wi-Fi kampus, internet"], ["Procedure", "Aturan cara memakai komponen lain untuk menghasilkan keluaran", "Presensi dibuka 15 menit pertama, izin lewat surat"], ["People", "Yang merancang, mengoperasikan, dan memakai. Paling sering terlupa, paling menentukan", "Mahasiswa, dosen, admin akademik"]], "w": [1.3, 3.0, 2.6]}, {"t": "img", "f": "s1_p27.jpg", "cap": "Slide kuliah hlm. 27: model enam komponen SI"}, {"t": "box", "kind": "awas", "title": "Salah kaprah yang sering muncul", "x": ["\"SI = aplikasi.\" Aplikasi hanya komponen software. Proyek SI sering gagal bukan karena programnya jelek, tetapi karena prosedur tidak diubah dan penggunanya tidak disiapkan."]}, {"t": "box", "kind": "langkah", "title": "Membedah sebuah sistem informasi", "x": ["Tentukan proses bisnis yang didukung. Contoh: presensi kuliah.", "Daftar siapa saja yang terlibat (people) dan apa perannya.", "Tulis data yang dicatat dan informasi yang dihasilkan.", "Kenali perangkat, aplikasi, basis data, dan jaringan yang dipakai.", "Tulis prosedurnya: aturan kapan dan bagaimana sistem dipakai.", "Tanyakan: komponen mana yang paling sering menjadi sumber masalah?"]}, {"t": "box", "kind": "aturan", "title": "Aturan main", "x": ["Keenam komponen harus ada; jika salah satu hilang, itu belum sistem informasi yang utuh.", "Mulai dari proses bisnis, bukan dari teknologinya.", "People dan procedure selalu ditulis, jangan hanya hardware dan software."]}, {"t": "h", "x": "Jenis keputusan dan tingkat manajemen"}, {"t": "p", "x": "SI dibuat untuk membantu pengambilan keputusan. Keputusan yang baik butuh pengetahuan yang jelas tentang masalahnya. Karena jenis keputusan berbeda di tiap tingkat, bentuk SI-nya juga berbeda."}, {"t": "table", "head": ["Jenis keputusan", "Ciri", "Contoh"], "rows": [["Terstruktur", "Berulang, rutin, ada prosedur baku", "Memesan ulang bahan saat stok di bawah titik pemesanan"], ["Semi-terstruktur", "Hanya sebagian yang punya jawaban jelas lewat prosedur baku", "Menyusun jadwal produksi saat ada pesanan mendadak"], ["Tidak terstruktur", "Tidak rutin, mengandalkan penilaian dan evaluasi mendalam, tanpa prosedur baku", "Memutuskan membangun pabrik baru di luar negeri"]], "w": [1.5, 2.9, 2.5]}, {"t": "table", "head": ["Tingkat", "Fokus keputusan", "SI pendukung"], "rows": [["Strategis (manajemen puncak)", "Tujuan jangka panjang, sumber daya, kebijakan organisasi", "ESS / dashboard"], ["Knowledge (pekerja pengetahuan dan data)", "Menilai ide produk dan jasa baru, menyebarkan pengetahuan", "OAS, CAD/CAM, GIS"], ["Management control (manajemen menengah)", "Mengendalikan efisiensi dan efektivitas pemakaian sumber daya", "MIS, DSS"], ["Operational control (manajemen operasional)", "Cara tugas dijalankan, kriteria penyelesaian, alokasi sumber daya", "TPS"]], "w": [2.3, 2.9, 1.7]}, {"t": "img", "f": "d1_piramida_manajemen.png", "cap": "Diagram rangkuman: piramida tingkat manajemen, jenis keputusan, dan SI pendukung"}, {"t": "img", "f": "s1_p31.jpg", "cap": "Slide kuliah hlm. 31: SI dan hierarki manajemen"}, {"t": "box", "kind": "langkah", "title": "Menentukan SI yang cocok untuk sebuah keputusan", "x": ["Tulis keputusannya dalam satu kalimat tanya.", "Tentukan siapa pengambil keputusannya dan di tingkat manajemen mana.", "Nilai strukturnya: adakah prosedur baku? Seberapa sering berulang?", "Tentukan informasi yang dibutuhkan: rinci atau ringkas, internal atau eksternal.", "Cocokkan dengan jenis SI: TPS, MIS, DSS, atau ESS."]}, {"t": "box", "kind": "tips", "title": "Tips", "x": ["Satu keputusan bisa bergeser jenisnya. Penjadwalan produksi yang dulu mengandalkan intuisi bisa menjadi terstruktur setelah aturannya dibakukan.", "Jika ragu antara taktis dan strategis, lihat horizon waktunya: bulanan atau kuartalan biasanya taktis, tahunan ke atas biasanya strategis."]}, {"t": "h", "x": "Dari stasiun kerja sampai lintas perusahaan"}, {"t": "p", "x": "Pemakaian TI di organisasi berkembang dalam tiga lingkup: (1) SI yang mendukung satu stasiun kerja atau departemen, (2) SI lintas fungsi di seluruh perusahaan, yaitu **ERP**, dan (3) sistem yang menjangkau ke luar perusahaan seperti **SCM**, Vendor Managed Inventory, dan selling chain management."}, {"t": "p", "x": "Turban (2005) mendefinisikan ERP sebagai sistem seluruh organisasi yang memungkinkan orang saling berkomunikasi dan mengakses data yang sesuai di seluruh perusahaan. Enterprise system atau e-business system memperluas integrasi itu ke pemasok, pelanggan, mitra, investor, dan regulator."}, {"t": "img", "f": "s1_p08.jpg", "cap": "Slide kuliah hlm. 8: arsitektur aplikasi bisnis enterprise (SCM, ERP, CRM)"}, {"t": "box", "kind": "contoh", "title": "Contoh integrasi", "x": ["Toko online kehabisan stok sepatu ukuran 42. Tanpa integrasi: staf gudang menelepon bagian pembelian, lalu pembelian mengirim email ke pemasok. Dengan ERP yang terhubung ke pemasok: penjualan mengurangi stok, stok menyentuh batas minimum, purchase order terbit otomatis dan pemasok langsung melihatnya."]}, {"t": "h", "x": "Kegiatan perancangan SI: gambaran SDLC"}, {"t": "p", "x": "Empat tahap pertama SDLC (investigasi, analisis, desain, implementasi) adalah fase **pengembangan**: sistem dibangun sampai terpasang, dan pengguna disiapkan. Tahap berikutnya (pemeliharaan dan review) adalah fase **pasca-implementasi**: sistem dipakai, dipelihara, dan terus diperbaiki. Seluruh mata kuliah ini mengikuti urutan tersebut."}, {"t": "img", "f": "s1_p10.jpg", "cap": "Slide kuliah hlm. 10: Systems Development Life Cycle"}, {"t": "img", "f": "d0_peta_materi.png", "cap": "Diagram rangkuman: posisi tiap materi APSI dalam siklus pengembangan sistem"}, {"t": "box", "kind": "latihan", "title": "Latihan 10 menit", "x": ["Pilih satu sistem yang kamu pakai sehari-hari (sistem akademik, e-wallet, ojek online). Isi tabel enam komponennya, lalu sebutkan satu keputusan terstruktur dan satu keputusan tidak terstruktur yang didukung sistem itu."]}], "karier": {"intro": "Materi ini adalah bahasa dasar untuk hampir semua pekerjaan yang bersinggungan dengan sistem dan data. Pewawancara kerja sering bertanya \"ceritakan proses bisnis dan informasi apa yang dibutuhkan di tiap tahap\"; kerangka di materi ini yang dipakai untuk menjawabnya.", "peran": [["Business analyst / system analyst", "Memetakan keputusan tiap level manajemen lalu menentukan informasi dan laporan yang mereka butuhkan"], ["Management trainee dan supervisor produksi", "Membaca laporan harian (informasi) dan mengubahnya menjadi tindakan di lantai produksi"], ["Konsultan ERP (SAP, Oracle, Odoo)", "Menjelaskan ke klien mengapa integrasi lintas fungsi mengurangi kerja ganda dan salah data"], ["Data analyst / BI analyst", "Mengolah data transaksi menjadi informasi dan insight untuk manajemen"]], "skill": ["Berpikir sistem: melihat proses ujung ke ujung, bukan per departemen", "Membedakan kebutuhan informasi operasional dan strategis", "Komunikasi dengan pihak bisnis dan pihak teknis"]}, "kunci": [["Data", "Fakta mentah yang belum diolah"], ["Informasi", "Data yang diolah sehingga bernilai bagi penggunanya"], ["Pengetahuan", "Pemahaman atas informasi dan cara memakainya untuk keputusan"], ["Sistem informasi", "Konfigurasi sumber daya TI dan proses organisasi untuk mendukung proses tertentu"], ["Keputusan terstruktur", "Keputusan rutin dengan prosedur baku"], ["ERP", "Sistem terintegrasi seluruh perusahaan dengan satu basis data"], ["Enterprise system", "Sistem yang memperluas integrasi sampai pemasok, pelanggan, dan mitra"]], "kuis": [["Sebutkan enam komponen sistem informasi.", "Hardware, software, database, network, procedure, people."], ["\"Total penjualan bulan Maret turun 12% dibanding Februari\" termasuk data, informasi, atau pengetahuan?", "Informasi, karena sudah merupakan hasil olahan dan perbandingan dari data transaksi."], ["Manajer puncak lebih banyak menghadapi keputusan jenis apa, dan SI apa yang mendukungnya?", "Keputusan tidak terstruktur dan strategis; didukung ESS/dashboard (serta DSS)."], ["Apa beda TI dan SI?", "TI adalah teknologi komputer dan telekomunikasi. SI adalah TI ditambah manusia, data, dan proses yang bersama-sama mendukung operasi dan keputusan."], ["Mengapa ERP disebut pendukung integrasi?", "Karena semua fungsi memakai satu sistem dan satu basis data, sehingga data dimasukkan sekali dan dipakai bersama lintas departemen."]]}, {"id": "m2", "no": 2, "minggu": "Minggu 2", "judul": "Bentuk-bentuk Khusus Sistem Informasi", "sumber": "2---Bentuk-Khusus-SI-.pdf (47 slide)", "ringkas": "Enam bentuk SI (TPS, MIS, DSS, ES, ESS, BI): siapa penggunanya, data apa yang dipakai, dan keputusan apa yang didukung.", "tujuan": ["Menjelaskan fungsi dan ciri TPS, MIS, DSS, ES, ESS, dan BI", "Menjelaskan bagaimana data mengalir dari TPS ke sistem di atasnya", "Membandingkan kebutuhan informasi manajemen bawah dan puncak", "Menerapkan pedoman penyusunan laporan MIS", "Menjelaskan komponen sistem pakar dan data warehouse"], "blocks": [{"t": "h", "x": "Gambaran besar"}, {"t": "p", "x": "Keenam bentuk SI bukan pilihan yang saling menggantikan. Mereka bertingkat: TPS menghasilkan data transaksi, MIS merangkumnya menjadi laporan, DSS menganalisisnya dengan model, dan ESS/BI menyajikannya ringkas untuk pimpinan. Sistem pakar berdiri agak terpisah karena isinya pengetahuan ahli, bukan data transaksi."}, {"t": "img", "f": "d2_alur_tps_ess.png", "cap": "Diagram rangkuman: aliran data dari TPS sampai ESS pada jaringan minimarket"}, {"t": "img", "f": "s2_p04.jpg", "cap": "Slide kuliah hlm. 4: jenis SI pada tiap tingkat organisasi dan area fungsional"}, {"t": "h", "x": "Transaction Processing System (TPS)"}, {"t": "ul", "x": ["Berkembang pada 1950-1960 ketika komputer mulai dipakai bisnis karena cepat dan akurat.", "Fokus: **otomasi pengolahan data transaksi**. Membantu pelaksana bekerja dan supervisor mengawasi.", "Menghasilkan dua jenis informasi: transaksi rinci dan transaksi agregat.", "Ciri: masukan data tingkat operasional; bisa batch, online, atau real-time; menjadi sumber data mentah bagi sistem lain; mudah dijustifikasi biayanya.", "**GIGO** (garbage in, garbage out): data salah di TPS membuat semua laporan di atasnya ikut salah."]}, {"t": "box", "kind": "contoh", "title": "Contoh TPS", "x": ["Mesin kasir minimarket, sistem tiket kereta, mesin ATM, presensi sidik jari, pencatatan hasil produksi per shift. Batch: penggajian dihitung sebulan sekali. Real-time: saldo berkurang saat itu juga ketika tarik tunai."]}, {"t": "h", "x": "Management Information System (MIS)"}, {"t": "p", "x": "Kumpulan terorganisasi dari orang, prosedur, software, database, dan perangkat untuk memberi **informasi rutin** kepada manajer. MIS membuat laporan dalam format yang benar saat dibutuhkan, dengan data dari TPS. Informasi yang baik untuk keputusan: akurat, relevan, mutakhir, dan tersedia tepat waktu."}, {"t": "table", "head": ["Peran manajer (Mintzberg)", "Isi peran", "Dukungan MIS"], "rows": [["Interpersonal", "Mewakili unit, memimpin, bekerja sama", "Informasi yang cukup untuk rapat dan memotivasi tim"], ["Informasional", "Memantau, mengumpulkan data, menjadi juru bicara", "Laporan dan ringkasan kinerja"], ["Pengambil keputusan", "Alokasi sumber daya, menangani gangguan, negosiasi, perbaikan", "Indikator kinerja dan data pembanding"]], "w": [1.7, 2.5, 2.7]}, {"t": "img", "f": "s2_p25.jpg", "cap": "Slide kuliah hlm. 25: MIS mengambil data dari TPS dan menyajikan laporan kepada manajer (Laudon & Laudon, 2013)"}, {"t": "img", "f": "s2_p12.jpg", "cap": "Slide kuliah hlm. 12: contoh arsitektur: TPS, database, MIS, DSS, ESS, dan sistem pakar"}, {"t": "h", "x": "Tingkat manajemen dan kebutuhan informasinya"}, {"t": "ul", "x": ["**Manajemen puncak**: memimpin seluruh operasi, menetapkan visi, misi, tujuan, strategi, kebijakan, dan mengendalikan pelaksanaannya.", "**Manajemen menengah**: menerjemahkan strategi menjadi rencana operasional, menyediakan sumber daya, menyusun anggaran, berkoordinasi antarfungsi.", "**Manajemen bawah**: merencanakan dan mengawasi kegiatan harian, membantu pelaksana memecahkan masalah operasional, mengumpulkan data dan melaporkan."]}, {"t": "table", "head": ["Karakteristik", "Manajemen bawah", "Manajemen puncak"], "rows": [["Sumber data", "Internal", "Internal dan eksternal"], ["Cakupan", "Sempit dan spesifik", "Luas dan menyeluruh"], ["Peluang salah", "Rendah", "Tinggi"], ["Tingkat rincian", "Rinci", "Agregat"], ["Horizon waktu", "Pendek", "Panjang"], ["Umur informasi", "Baru", "Lama (historis)"]], "w": [2.0, 2.4, 2.5]}, {"t": "p", "x": "Laporan MIS harus bisa memberi tahu manajer apakah ia bekerja efisien, efektif, atau belum keduanya. **Efisien** = doing the things right, dilihat dari selisih masukan dan keluaran. **Efektif** = doing the right things, dilihat dari selisih target dan realisasi."}, {"t": "box", "kind": "contoh", "title": "Efisien tetapi tidak efektif", "x": ["Lini produksi membuat 1.000 unit dengan bahan paling hemat (efisien), tetapi yang dibuat adalah varian yang tidak laku sehingga target penjualan tidak tercapai (tidak efektif)."]}, {"t": "table", "head": ["Pedoman laporan MIS", "Alasan"], "rows": [["Sesuaikan tiap laporan dengan kebutuhan pengguna", "Kebutuhan tiap manajer unik; perlu keterlibatan pengguna"], ["Buat hanya laporan yang berguna", "Banyak laporan terus dicetak padahal tidak dibaca lagi"], ["Perhatikan isi dan tata letak", "Tonjolkan informasi utama, jangan penuhi dengan data tak perlu"], ["Gunakan management by exception", "Sebagian laporan cukup muncul saat ada masalah atau tindakan yang perlu diambil"], ["Tetapkan parameter dengan cermat", "Batas terlalu rendah menghasilkan terlalu banyak laporan; terlalu tinggi membuat informasi penting terlewat"], ["Terbitkan tepat waktu", "Laporan yang usang hampir tidak bernilai"], ["Tinjau laporan secara berkala", "Minimal setahun sekali cek apakah masih dibutuhkan"]], "w": [2.7, 4.2]}, {"t": "box", "kind": "langkah", "title": "Merancang satu laporan MIS", "x": ["Tentukan pembacanya dan keputusan yang akan ia ambil dari laporan itu.", "Pilih 3-5 ukuran: pemakaian sumber daya, efisiensi, dan efektivitas.", "Tentukan sumber datanya (TPS mana) dan periode laporannya.", "Tetapkan ambang batas untuk laporan pengecualian.", "Susun tata letak: angka terpenting di atas, rincian di bawah.", "Uji ke pembaca, lalu jadwalkan peninjauan minimal setahun sekali."]}, {"t": "box", "kind": "tips", "title": "Tips", "x": ["Bandingkan selalu dengan sesuatu: target, periode lalu, atau unit lain. Angka tanpa pembanding tidak membantu keputusan.", "Satu pertanyaan untuk membedakan: TPS mencatat, MIS melaporkan, DSS menganalisis, ES menyarankan, ESS meringkas."]}, {"t": "h", "x": "Decision Support System (DSS)"}, {"t": "p", "x": "Sistem tingkat manajemen yang menggabungkan **data, model, dan software yang mudah dipakai** untuk keputusan semi-terstruktur dan tidak terstruktur. Dua tipe utama: **model-driven** (memakai model untuk analisis what-if) dan **data-driven** (menggali dan menganalisis informasi dari basis data, termasuk data mining). Rinciannya dibahas di Materi 3."}, {"t": "img", "f": "s2_p28.jpg", "cap": "Slide kuliah hlm. 28: komponen DSS: TPS, data eksternal, database DSS, model, OLAP, data mining, antarmuka"}, {"t": "box", "kind": "contoh", "title": "Contoh dari slide: DSS perusahaan pelayaran", "x": ["Dengan jadwal kirim pelanggan dan tarif angkut tertentu, kapal mana yang ditugaskan agar laba maksimal? Berapa kecepatan optimal kapal agar laba maksimal tetapi tetap tepat jadwal? Bagaimana pola muat optimal untuk kapal dari Malaysia ke Pantai Barat AS?"]}, {"t": "h", "x": "Expert System (ES)"}, {"t": "p", "x": "Sistem berbasis pengetahuan yang memakai pengetahuan tentang area spesifik dan kompleks untuk bertindak sebagai **konsultan ahli** bagi pengguna. Sistem mengajukan pertanyaan lalu memberi saran; ia **tidak mengambil keputusan**."}, {"t": "ul", "x": ["**Knowledge base**: berisi pengetahuan faktual (fakta tentang suatu bidang) dan heuristik (aturan praktis, biasanya berbentuk aturan JIKA-MAKA).", "**Inference engine**: bagian penalaran; mengolah pengetahuan terkait masalah lalu menarik kesimpulan berupa rekomendasi tindakan.", "**User interface**: sarana interaksi pengguna."]}, {"t": "p", "x": "Cara membuat: knowledge engineer menggali pengetahuan dari pakar, menuliskannya ke knowledge base memakai ES shell (sudah berisi antarmuka dan inference engine), lalu menguji dan menyempurnakannya berulang kali."}, {"t": "img", "f": "d2_sistem_pakar.png", "cap": "Diagram rangkuman: komponen dan cara kerja sistem pakar"}, {"t": "img", "f": "s2_p35.jpg", "cap": "Slide kuliah hlm. 35: komponen sistem pakar dan proses pengembangannya"}, {"t": "table", "head": ["Kelebihan", "Kekurangan"], "rows": [["Lebih murah daripada mempekerjakan pakar", "Mahal dan sulit dibangun"], ["Lebih konsisten daripada pakar", "Dianggap ancaman oleh pakar di perusahaan"], ["Selalu tersedia", ""], ["Tidak akan keluar dari perusahaan", ""]], "w": [3.4, 3.5]}, {"t": "p", "x": "Kategori penerapan: manajemen keputusan, diagnosis dan troubleshooting, pemeliharaan dan penjadwalan, desain dan konfigurasi, seleksi dan klasifikasi, pemantauan dan pengendalian proses."}, {"t": "box", "kind": "langkah", "title": "Membuat sistem pakar sederhana", "x": ["Pilih masalah yang sempit dan punya pakar yang jelas.", "Wawancarai pakar; catat fakta dan aturan praktisnya.", "Tulis aturan dalam bentuk JIKA kondisi MAKA kesimpulan.", "Masukkan ke shell sistem pakar (atau tabel keputusan di spreadsheet).", "Uji dengan kasus nyata dan bandingkan dengan jawaban pakar.", "Perbaiki aturan yang salah; ulangi sampai hasilnya konsisten."]}, {"t": "box", "kind": "aturan", "title": "Aturan menulis aturan JIKA-MAKA", "x": ["Satu aturan, satu kesimpulan.", "Kondisi harus bisa diamati atau diukur pengguna.", "Hindari dua aturan dengan kondisi sama tetapi kesimpulan berbeda.", "Sistem memberi saran; keputusan akhir tetap pada manusia."]}, {"t": "h", "x": "Executive Support System (ESS) dan Business Intelligence"}, {"t": "p", "x": "ESS adalah SI strategis untuk keputusan tidak terstruktur dengan grafik dan komunikasi canggih, dirancang untuk kebutuhan eksekutif. Fitur khasnya **drill down**: berpindah dari ringkasan ke rincian. Manfaat: fleksibel, bisa menganalisis dan membandingkan tren, grafik membantu memahami situasi, memantau kinerja, dan data yang tepat waktu memungkinkan tindakan cepat."}, {"t": "p", "x": "BI melayani kebutuhan keputusan manajemen tingkat tinggi tentang tren strategis jangka panjang dengan memakai data internal dan eksternal: basis data perusahaan, data warehouse dan data mart, basis data eksternal, dan big data. **Data warehouse** adalah kumpulan data yang subject-oriented, integrated, non-volatile, dan time-variant untuk mendukung keputusan manajemen. Komponen BI: software visualisasi data, KPI yang mudah dipahami, serta alat pembuat dashboard dan scorecard."}, {"t": "img", "f": "s2_p42.jpg", "cap": "Slide kuliah hlm. 42: contoh tampilan ESS / dashboard"}, {"t": "img", "f": "s2_p45.jpg", "cap": "Slide kuliah hlm. 45: data warehouse"}, {"t": "box", "kind": "contoh", "title": "Drill down dalam praktik", "x": ["Direktur melihat laba nasional turun 8%. Klik wilayah: Jawa Barat turun 20%. Klik kota: Bandung. Klik toko: dua toko baru belum balik modal. Dari satu angka ringkas ia sampai ke sumber masalah tanpa meminta laporan baru."]}, {"t": "box", "kind": "latihan", "title": "Tebak sistemnya", "x": ["Tentukan jenis SI untuk tiap situasi: kasir memindai barang; laporan absensi bulanan; simulasi dampak kenaikan harga; chatbot diagnosis kerusakan; dashboard direksi. Jawaban: TPS, MIS, DSS, ES, ESS.", "Yang paling sering tertukar adalah MIS dan DSS. Kuncinya: MIS menjawab \"apa yang terjadi\" secara rutin, DSS menjawab \"bagaimana jika\"."]}], "karier": {"intro": "Di tempat kerja, kalian akan menjadi pengguna sekaligus perancang sistem-sistem ini. Tren saat ini: TPS dan MIS sudah menjadi bagian dari ERP, sedangkan DSS dan ESS berkembang menjadi platform analytics dan BI.", "peran": [["BI / data analyst", "Membangun dashboard (Power BI, Tableau, Looker) yang pada dasarnya adalah ESS modern; menentukan KPI dan drill-down"], ["Production planner / PPIC", "Memakai laporan MIS (kapasitas, stok, jadwal) dan alat what-if untuk menyusun rencana"], ["Konsultan ERP", "Mengonfigurasi modul transaksi (TPS) dan laporan standar untuk tiap level manajemen"], ["Knowledge / process engineer", "Menuangkan aturan ahli ke sistem, misalnya aturan inspeksi mutu atau troubleshooting mesin"]], "skill": ["Mendesain laporan: siapa pembacanya, keputusan apa, seberapa rinci", "Dasar data warehouse dan SQL", "Menentukan KPI efisiensi dan efektivitas"]}, "kunci": [["TPS", "Sistem pengolah transaksi harian tingkat operasional"], ["MIS", "Sistem penghasil laporan rutin untuk manajer"], ["DSS", "Sistem data + model untuk keputusan semi/tidak terstruktur"], ["Expert system", "Sistem berbasis pengetahuan pakar yang memberi saran"], ["ESS", "Sistem ringkas-grafis untuk eksekutif, dengan drill down"], ["GIGO", "Garbage in, garbage out"], ["Management by exception", "Laporan hanya muncul saat ada penyimpangan"], ["Data warehouse", "Gudang data historis terintegrasi untuk analisis"], ["Inference engine", "Komponen penalaran pada sistem pakar"]], "kuis": [["Apa arti GIGO dan mengapa penting bagi TPS?", "Garbage in, garbage out. TPS adalah sumber data bagi MIS, DSS, dan ESS; bila masukannya salah, semua keluaran di atasnya salah."], ["Sebutkan tiga beda kebutuhan informasi manajemen bawah dan puncak.", "Bawah: sumber internal, rinci, horizon pendek. Puncak: internal+eksternal, agregat, horizon panjang (juga cakupan luas, peluang salah lebih tinggi)."], ["Apa beda efisien dan efektif?", "Efisien: melakukan sesuatu dengan benar (masukan vs keluaran). Efektif: melakukan hal yang benar (target vs realisasi)."], ["Sebutkan tiga komponen sistem pakar.", "Knowledge base, inference engine, user interface."], ["Apakah sistem pakar mengambil keputusan?", "Tidak. Sistem pakar memberi saran seperti konsultan; keputusan tetap pada pengguna."], ["Apa itu drill down?", "Kemampuan berpindah dari informasi ringkas ke tingkat rincian yang lebih rendah."]]}, {"id": "m3", "no": 3, "minggu": "Minggu 3", "judul": "Sistem Pendukung Keputusan (SPK)", "sumber": "3-Sistem-Pendukung-Keputusan.pdf (37 slide)", "ringkas": "Cara manusia mengambil keputusan (model Simon), komponen dan tipe DSS, serta cara merancang SPK sederhana dengan AHP.", "tujuan": ["Menjelaskan hakikat dan langkah pengambilan keputusan", "Menjelaskan hakikat, karakteristik, dan atribut SPK", "Menyebutkan tiga komponen SPK", "Membedakan model-driven dan data-driven DSS", "Merancang SPK sederhana dengan model AHP"], "blocks": [{"t": "h", "x": "Pengambilan keputusan"}, {"t": "p", "x": "Pengambilan keputusan adalah proses memilih di antara alternatif berdasarkan kriteria tertentu, dengan mengumpulkan informasi dan menilai alternatif. Model yang dipakai pengambil keputusan bisa berupa model mental (kualitatif) atau gabungan model mental dengan model kuantitatif."}, {"t": "table", "head": ["Pendekatan", "Inti", "Hasil"], "rows": [["Kuantitatif (metode ilmiah)", "Observasi, definisi masalah, identifikasi alternatif, pemilihan optimum dengan metode ilmiah, verifikasi, implementasi", "Alternatif **optimal**: memaksimalkan laba/utilitas atau meminimalkan biaya"], ["Decision-centered (Simon)", "Informasi sering tidak lengkap sehingga optimum tidak bisa dicapai", "Keputusan **satisficing**: bukan yang terbaik, tetapi memuaskan dan bisa diterima"]], "w": [1.9, 3.0, 2.0]}, {"t": "p", "x": "Langkah keputusan menurut Simon: **Intelligence** (mencari dan merumuskan masalah atau peluang), **Design** (mengembangkan beberapa alternatif solusi), **Choice** (membandingkan dan memilih), lalu **Implementation** (menjalankan dan memantau agar bisa diperbaiki)."}, {"t": "img", "f": "d3_tahap_simon.png", "cap": "Diagram rangkuman: empat tahap Simon dengan contoh memilih supplier kain"}, {"t": "img", "f": "s3_p29.jpg", "cap": "Slide kuliah hlm. 29: rincian aktivitas tiap fase; DSS berfokus pada intelligence, design, choice"}, {"t": "box", "kind": "contoh", "title": "Satisficing sehari-hari", "x": ["Mencari kos: kalian tidak mensurvei semua kos di Bandung (optimal). Kalian berhenti pada kos ketiga yang harganya masuk, dekat kampus, dan ada Wi-Fi (satisficing)."]}, {"t": "h", "x": "Hakikat DSS"}, {"t": "p", "x": "DSS adalah SI **interaktif** yang membantu pengambil keputusan menghadapi masalah yang tidak terstruktur dengan baik, memakai **model analitis dan akses ke basis data**. DSS dirancang untuk **mendukung proses** pengambilan keputusan, bukan menggantikannya."}, {"t": "p", "x": "Manajer di tingkat strategis dan taktis butuh informasi kompleks untuk keputusan bermutu; pengalaman saja tidak cukup. DSS memudahkan pemakaian model matematis dan statistik serta menyediakan data yang relevan. DSS memadukan penilaian subjektif manusia (intuisi, pengalaman) dengan keluaran objektif komputer."}, {"t": "table", "head": ["Karakteristik dukungan DSS", "Atribut DSS"], "rows": [["Untuk masalah semi-terstruktur dan tidak terstruktur", "Adaptif dan fleksibel"], ["Untuk manajer di berbagai tingkat", "Interaktivitas tinggi"], ["Untuk individu maupun kelompok", "Mudah digunakan"], ["Untuk keputusan yang saling bergantung atau berurutan", "Lebih menekankan efektivitas"], ["Untuk tahap intelligence, design, dan choice", "Kendali penuh di tangan pengambil keputusan"], ["Untuk beragam proses dan gaya keputusan", "Mendukung pemodelan, analisis, dan akses data"]], "w": [3.5, 3.4]}, {"t": "h", "x": "Komponen DSS"}, {"t": "ul", "x": ["**Subsistem manajemen data**: memasok data (internal dan eksternal) untuk diolah model.", "**Subsistem manajemen model**: memelihara pustaka model; memfasilitasi analisis **what-if** dan **goal-seeking**.", "**Subsistem dialog (antarmuka)**: membantu pengguna menerapkan model pada data lewat form masukan dan keluaran sesuai gaya keputusannya."]}, {"t": "p", "x": "Arsitektur yang lebih lengkap menambahkan komponen knowledge management dan, untuk keputusan berbasis lokasi, komponen GIS."}, {"t": "img", "f": "s3_p19.jpg", "cap": "Slide kuliah hlm. 19: tiga komponen DSS"}, {"t": "img", "f": "s3_p24.jpg", "cap": "Slide kuliah hlm. 24: arsitektur aplikasi DSS tipe hibrida"}, {"t": "box", "kind": "contoh", "title": "What-if dan goal-seeking", "x": ["What-if: \"Jika harga bahan baku naik 10%, berapa laba saya?\" (ubah masukan, lihat keluaran). Goal-seeking: \"Agar laba Rp50 juta, berapa unit yang harus terjual?\" (tetapkan keluaran, cari masukan). Di Excel keduanya tersedia pada menu What-If Analysis."]}, {"t": "h", "x": "Dua tipe utama DSS"}, {"t": "table", "head": ["Tipe", "Cara kerja", "Contoh metode"], "rows": [["Model-driven", "Memakai model untuk what-if dan analisis lain", "AHP, pohon keputusan dan multi-attribute utility, peramalan, optimasi dan jaringan, simulasi"], ["Data-driven", "Menggali dan menganalisis informasi dari basis data besar", "Data mining, analisis klaster (k-means, hierarchical, DBSCAN)"]], "w": [1.4, 2.6, 2.9]}, {"t": "p", "x": "**Pohon keputusan** memakai simpul keputusan (kotak) dan simpul peluang (lingkaran). Jumlah peluang pada cabang yang keluar dari satu simpul peluang harus 1. Perhitungan menghasilkan expected payoff tiap cabang."}, {"t": "img", "f": "d3_pohon_keputusan.png", "cap": "Diagram rangkuman: contoh hitung pohon keputusan"}, {"t": "p", "x": "**Clustering** mengelompokkan objek sehingga objek dalam satu kelompok lebih mirip satu sama lain dibanding objek di kelompok lain."}, {"t": "img", "f": "s3_p23.jpg", "cap": "Slide kuliah hlm. 23: contoh data-driven DSS: clustering"}, {"t": "box", "kind": "contoh", "title": "Clustering di ritel", "x": ["Minimarket mengelompokkan pelanggan dari data belanja: kelompok A (belanja kecil tetapi sering), B (belanja bulanan besar), C (pemburu promo). Tiap kelompok mendapat promosi berbeda."]}, {"t": "box", "kind": "langkah", "title": "Membuat pohon keputusan", "x": ["Gambar simpul keputusan (kotak) dan satu cabang untuk tiap alternatif.", "Di ujung tiap alternatif, gambar simpul peluang (lingkaran) dan cabang tiap kejadian.", "Tulis peluang tiap kejadian dan hasil (payoff) di ujung cabang.", "Hitung EMV tiap simpul peluang: jumlah dari peluang x hasil.", "Pilih alternatif dengan EMV terbaik; coret cabang lain."]}, {"t": "box", "kind": "aturan", "title": "Aturan pohon keputusan", "x": ["Jumlah peluang pada cabang yang keluar dari satu simpul peluang harus 1.", "Hitung dari kanan ke kiri (dari ujung ke pangkal).", "Kotak untuk hal yang kamu pilih, lingkaran untuk hal yang tidak bisa kamu kendalikan."]}, {"t": "h", "x": "Membangun SPK dengan AHP"}, {"t": "p", "x": "AHP (Analytical Hierarchy Process) cocok untuk memilih di antara beberapa alternatif dengan banyak kriteria, termasuk kriteria kualitatif. Langkah di slide mengikuti fase Simon:"}, {"t": "ol", "x": ["**Intelligence**: identifikasi masalah. Apa masalahnya, siapa pemiliknya, jenis keputusan apa, bisakah diuraikan?", "**Design, siapkan model**: satu tujuan di puncak, beberapa kriteria (kuantitatif atau kualitatif), dan sejumlah alternatif. Model disimpan di model base.", "**Design, siapkan data**: bobot tiap kriteria dan skor tiap alternatif pada tiap kriteria. Data disimpan di database; data historis ikut dipelihara.", "**Bangun antarmuka**: mudah dibuat pengguna, adaptif, terintegrasi dengan web, interaktif.", "**Choice**: hitung prioritas keseluruhan tiap alternatif, urutkan, ambil keputusan. Manusia tetap mengendalikan mesin."]}, {"t": "img", "f": "d3_ahp.png", "cap": "Diagram rangkuman: contoh hitung AHP tiga kriteria dan tiga alternatif"}, {"t": "img", "f": "s3_p32.jpg", "cap": "Slide kuliah hlm. 32: struktur model AHP: goal, kriteria, alternatif"}, {"t": "box", "kind": "awas", "title": "Catatan tentang contoh AHP", "x": ["Contoh hitung di atas menyederhanakan AHP: bobot dan skor langsung diberikan. Pada AHP lengkap, bobot diperoleh dari matriks perbandingan berpasangan (skala 1-9) dan diperiksa konsistensinya (consistency ratio di bawah 0,1). Slide kuliah tidak merinci bagian itu, jadi anggap sebagai pengayaan."]}, {"t": "box", "kind": "latihan", "title": "SPK mini di spreadsheet", "x": ["Buat SPK memilih laptop atau tempat magang di Excel: satu sheet data (alternatif dan skor), satu sheet model (bobot dan rumus SUMPRODUCT), satu sheet antarmuka (bobot yang bisa diubah dan peringkat). Tiga sheet itu persis tiga komponen DSS."]}, {"t": "box", "kind": "aturan", "title": "Aturan skor berbobot", "x": ["Total bobot semua kriteria harus 1 (atau 100%).", "Skor tiap alternatif pada satu kriteria harus memakai skala yang sama.", "Untuk kriteria biaya (makin kecil makin baik), balik dulu skalanya sebelum dikalikan bobot.", "Catat asal bobot: siapa yang menentukan dan dengan alasan apa."]}, {"t": "box", "kind": "tips", "title": "Tips", "x": ["Selalu lakukan analisis sensitivitas: ubah bobot sedikit dan lihat apakah peringkat berubah. Jika mudah berubah, keputusan belum kokoh.", "Batasi kriteria sekitar 3-7 agar perbandingan tetap bisa dipertanggungjawabkan."]}], "karier": {"intro": "Hampir semua keputusan besar di industri sekarang diminta \"berbasis data\". SPK adalah wujud formalnya. Lulusan TI unggul di sini karena sudah belajar optimasi, statistik, dan simulasi; tinggal membungkusnya menjadi alat yang bisa dipakai manajer.", "peran": [["Supply chain / procurement analyst", "Pemilihan pemasok multikriteria, penentuan lokasi gudang, analisis what-if biaya logistik"], ["Operations research / decision analyst", "Membangun model optimasi dan simulasi, lalu menyajikannya lewat antarmuka yang ramah pengguna"], ["Data scientist", "Clustering pelanggan, prediksi permintaan, data mining (sisi data-driven DSS)"], ["Konsultan manajemen", "Menstrukturkan masalah klien dengan kerangka intelligence, design, choice dan analisis sensitivitas"]], "skill": ["Pemodelan spreadsheet tingkat lanjut, what-if dan goal-seek", "Metode multikriteria (AHP, scoring) dan analisis sensitivitas", "Menerjemahkan hasil model menjadi rekomendasi yang bisa diputuskan"]}, "kunci": [["Satisficing", "Memilih alternatif yang memuaskan, bukan yang optimal"], ["Intelligence-Design-Choice", "Tiga fase keputusan Simon yang didukung DSS"], ["What-if analysis", "Mengubah masukan untuk melihat dampaknya pada keluaran"], ["Goal-seeking", "Menetapkan keluaran lalu mencari masukan yang diperlukan"], ["Model-driven DSS", "DSS yang bertumpu pada model"], ["Data-driven DSS", "DSS yang bertumpu pada penggalian data"], ["AHP", "Metode hierarki tujuan, kriteria, alternatif untuk keputusan multikriteria"], ["EMV", "Expected monetary value: jumlah hasil dikali peluangnya"]], "kuis": [["Sebutkan empat tahap keputusan menurut Simon.", "Intelligence, design, choice, implementation."], ["Apa arti satisficing?", "Memilih alternatif yang memuaskan dan dapat diterima walau bukan yang terbaik, karena informasi terbatas."], ["Sebutkan tiga komponen DSS.", "Subsistem manajemen data, subsistem manajemen model, subsistem dialog/antarmuka."], ["Pada contoh AHP, mengapa pilihan berubah dari A ke B saat bobot diubah?", "Karena B unggul di kualitas; ketika bobot kualitas dinaikkan dan harga diturunkan, skor total B (0,38) melampaui A (0,34)."], ["Hitung EMV: peluang 0,7 untung 100 dan 0,3 rugi 50.", "0,7 x 100 + 0,3 x (-50) = 70 - 15 = 55."], ["Apakah DSS menggantikan pengambil keputusan?", "Tidak. DSS mendukung proses; kendali dan keputusan akhir tetap pada manusia."]]}, {"id": "m4", "no": 4, "minggu": "Minggu 4", "judul": "Pengembangan Sistem Informasi", "sumber": "4---Pengembangan-Sistem-Informasi.pdf (54 slide)", "ringkas": "Dari mana proyek SI berasal, lima metode pengembangan (SDLC, prototyping, RAD, agile, standard package), dan delapan prinsip pengembangan.", "tujuan": ["Menjelaskan langkah penting pengembangan SI", "Membandingkan SDLC/waterfall, prototyping, RAD, agile, dan standard package", "Memilih metode yang cocok untuk suatu situasi", "Menjelaskan delapan prinsip dasar pengembangan SI"], "blocks": [{"t": "h", "x": "Dari mana proyek SI datang"}, {"t": "p", "x": "Inisiatif pengembangan sistem bisa muncul dari semua tingkat organisasi, terencana maupun tidak. Inisiatif yang terencana tertuang dalam **perencanaan strategis SI**, yang diturunkan dari rencana strategis bisnis. Perencanaan SI berarti menerjemahkan tujuan organisasi menjadi inisiatif pengembangan sistem dan menyelaraskan tujuan SI dengan tujuan organisasi."}, {"t": "p", "x": "**Pengembangan SI** adalah aktivitas menghasilkan SI untuk menyelesaikan masalah organisasi atau memanfaatkan peluang. **System analysis** = memahami cara kerja sistem dan masalahnya, lalu menentukan secara rinci **apa** yang harus dilakukan sistem. **System design** = menentukan secara rinci **bagaimana** bagian-bagian sistem diwujudkan."}, {"t": "h", "x": "Mengapa proses pengembangan harus dipahami: CMM"}, {"t": "p", "x": "Capability Maturity Model adalah kerangka baku untuk menilai kematangan proses pengembangan SI suatu organisasi."}, {"t": "table", "head": ["Level", "Nama", "Ciri"], "rows": [["1", "Initial", "Proyek tidak mengikuti proses yang ditetapkan"], ["2", "Repeatable", "Ada praktik manajemen proyek untuk melacak biaya, jadwal, fungsionalitas"], ["3", "Defined", "Ada metodologi baku; semua proyek memakainya"], ["4", "Managed", "Ada sasaran terukur untuk mutu dan produktivitas"], ["5", "Optimizing", "Proses baku terus dipantau dan diperbaiki berdasarkan data"]], "w": [0.7, 1.5, 4.7]}, {"t": "table", "head": ["Level CMM", "Durasi (bulan)", "Orang-bulan", "Cacat lolos", "Biaya median (juta USD)"], "rows": [["1", "30", "600", "61", "5,5"], ["2", "18,5", "143", "12", "1,3"], ["3", "15", "80", "7", "0,728"]], "w": [1.3, 1.4, 1.4, 1.3, 1.5]}, {"t": "p", "x": "Statistik di atas (proyek 200.000 baris kode, Whitten dkk., 2011) adalah argumen terkuat materi ini: naik dari level 1 ke level 3 memangkas durasi separuh, tenaga menjadi sekitar sepertujuh, dan cacat menjadi sekitar sepersembilan."}, {"t": "img", "f": "s4_p09.jpg", "cap": "Slide kuliah hlm. 9: siklus hidup sistem: pengembangan, lalu operasi dan pemeliharaan"}, {"t": "h", "x": "Metode 1: SDLC / Waterfall"}, {"t": "p", "x": "Metode paling klasik. Tahapnya berurutan: **perencanaan proyek** (lingkup, kelayakan, jadwal, sumber daya, anggaran), **analisis** (memahami dan mendokumentasikan kebutuhan bisnis dan proses), **desain** (merancang solusi berdasarkan kebutuhan), **implementasi** (membangun, menguji, memasang), dan **support** (menjaga sistem berjalan dan menyempurnakannya). Pengujian pada model modern hadir di semua tahap. FAST (Whitten) adalah variannya dengan delapan fase: survey, study, definition, targeting, purchasing (bila perlu), design, construction, delivery."}, {"t": "img", "f": "s4_p13.jpg", "cap": "Slide kuliah hlm. 13: langkah pengembangan SI klasik"}, {"t": "table", "head": ["Kelebihan SDLC", "Kekurangan SDLC"], "rows": [["Tinjauan formal di akhir tiap fase memberi kendali manajemen maksimal", "Pengguna mendapat sistem sesuai pemahaman pengembang, belum tentu sesuai kebutuhan sebenarnya"], ["Menghasilkan dokumentasi sistem yang lengkap", "Dokumentasi mahal dan lama dibuat, sulit dijaga tetap mutakhir"], ["Kebutuhan dapat ditelusuri kembali ke kebutuhan bisnis", "Kebutuhan pengguna sering tidak terungkap atau disalahpahami"], ["Banyak produk antara yang bisa diperiksa kesesuaiannya", "Pengguna sulit menilai produk antara seperti diagram"]], "w": [3.4, 3.5]}, {"t": "p", "x": "SDLC cocok untuk sistem besar. Tidak disarankan untuk proyek kecil karena boros sumber daya, tidak fleksibel, dan sulit untuk aplikasi yang cara pengambilan keputusannya cepat berubah. Biaya melakukan perubahan naik tajam makin ke belakang."}, {"t": "img", "f": "s4_p18.jpg", "cap": "Slide kuliah hlm. 18: biaya perubahan membesar pada tahap akhir SDLC"}, {"t": "h", "x": "Metode 2: Prototyping"}, {"t": "p", "x": "Pendekatan iteratif: buat prototipe atau mock-up yang bisa dicoba dengan data nyata, minta pengguna mencoba, perbaiki, ulangi."}, {"t": "table", "head": ["Kelebihan", "Kekurangan"], "rows": [["Komunikasi pengguna dan pengembang intensif", "Pendefinisian masalah bisa diambil jalan pintas"], ["Pengguna aktif menentukan kebutuhan", "Pengguna bisa menuntut terlalu banyak"], ["Waktu pengembangan relatif singkat", "Rancangan akhir bisa kurang baik"], ["Implementasi mudah karena pengguna sudah tahu hasilnya", ""]], "w": [3.4, 3.5]}, {"t": "img", "f": "s4_p21.jpg", "cap": "Slide kuliah hlm. 21: siklus prototyping"}, {"t": "h", "x": "Metode 3: Rapid Application Development (RAD)"}, {"t": "p", "x": "Strategi yang menekankan **kecepatan** lewat keterlibatan pengguna yang intensif dalam konstruksi serangkaian prototipe yang berfungsi, secara cepat, iteratif, dan inkremental, sampai berkembang menjadi sistem akhir. Prinsipnya: pengguna tahu apa yang mereka mau ketika melihatnya bekerja. RAD memakai konstruksi berbasis komponen dan workshop intensif yang melibatkan pemilik, pengguna, analis, perancang, dan pembangun sistem."}, {"t": "img", "f": "s4_p24.jpg", "cap": "Slide kuliah hlm. 24: alur RAD: modul dibangun, diuji, dan diberi umpan balik secara paralel"}, {"t": "table", "head": ["Aspek", "Waterfall", "RAD"], "rows": [["Waktu", "Mengikuti jadwal; perubahan besar berarti mulai ulang", "Terbuka; selesai saat klien puas"], ["Ukuran proyek ideal", "Sangat kecil dan sangat besar", "Kecil dan menengah"], ["Tim", "Kecil sampai besar; junior bisa bila spesifikasi jelas", "Harus kecil, berpengalaman, serba bisa"], ["Klien ideal", "Tahu persis maunya sejak awal", "Komunikatif, terbuka, selalu tersedia"], ["Sikap terhadap perubahan", "Sangat negatif; terbaik di awal", "Diterima kapan saja"], ["Biaya", "Tetap bila tidak ada perubahan", "Variabel, tergantung jumlah iterasi"], ["Prototipe", "Diserahkan setelah seluruh aplikasi jadi", "Model kerja diserahkan secepat mungkin"]], "w": [1.6, 2.6, 2.7]}, {"t": "p", "x": "Kelebihan RAD: kebutuhan lebih akurat, perubahan terlacak, umpan balik sering, waktu lebih singkat, mendorong penggunaan ulang kode, pengujian terus-menerus. Kekurangan: kurang cocok untuk sistem besar, butuh anggota tim yang lebih terampil, butuh akses ke pakar bisnis yang sibuk, kadang menghasilkan desain yang kurang optimal."}, {"t": "h", "x": "Metode 4: Agile"}, {"t": "p", "x": "Manifesto Agile (2001) menghargai: **individu dan interaksi** di atas proses dan alat; **software yang bekerja** di atas dokumentasi lengkap; **kolaborasi dengan pelanggan** di atas negosiasi kontrak; **tanggap terhadap perubahan** di atas mengikuti rencana. Yang di kanan tetap bernilai, tetapi yang di kiri lebih dihargai."}, {"t": "p", "x": "Tiga gagasan inti: **adaptif** (tim dan proses lentur menghadapi perubahan cepat), **iteratif dan inkremental** (menghasilkan produk yang bekerja secara bertahap), dan **berorientasi manusia**. Praktiknya: jaga tetap kecil, serahkan software sebagian-jadi secara sering, sering berbicara dengan pelanggan, lebih banyak kode daripada dokumen, seluruh tim belajar bersama. Tiap iterasi (misalnya 4 minggu) berisi sedikit analisis, desain, coding, integrasi, dan pengujian oleh tim lintas fungsi."}, {"t": "img", "f": "d4_waterfall_vs_agile.png", "cap": "Diagram rangkuman: perbandingan alur waterfall dan agile"}, {"t": "img", "f": "s4_p32.jpg", "cap": "Slide kuliah hlm. 32: iterasi pendek pada agile dengan demo di tiap iterasi"}, {"t": "table", "head": ["Waterfall", "Agile"], "rows": [["Tahap berurutan; satu siklus, satu rilis", "Iteratif; banyak iterasi dan banyak rilis"], ["Siklus dibagi menjadi fase", "Siklus dibagi menjadi sprint"], ["Terstruktur dan kaku; perencanaan jangka panjang", "Fleksibel; perencanaan jangka pendek"], ["Masalah lama baru ketahuan", "Masalah cepat ketahuan"], ["Pelanggan terlibat di awal dan saat serah terima", "Pelanggan terlibat sepanjang proyek"], ["Cocok bila kebutuhan jelas dan tidak berubah", "Cocok bila kebutuhan berkembang dan berubah"], ["Pola pikir proyek", "Pola pikir produk; MVP diserahkan tiap akhir sprint"]], "w": [3.4, 3.5]}, {"t": "box", "kind": "langkah", "title": "Menjalankan satu sprint", "x": ["Susun daftar kebutuhan berprioritas (product backlog).", "Sprint planning: pilih butir yang sanggup diselesaikan dalam 2-4 minggu.", "Kerjakan: analisis, desain, coding, dan uji berjalan bersama; rapat singkat harian.", "Sprint review: demo hasil ke pengguna dan kumpulkan umpan balik.", "Retrospektif: apa yang perlu diperbaiki dari cara kerja tim.", "Perbarui backlog, lalu mulai sprint berikutnya."]}, {"t": "box", "kind": "aturan", "title": "Aturan main agile", "x": ["Tiap sprint harus menghasilkan sesuatu yang bisa dipakai, bukan setengah jadi.", "Lingkup sprint yang sedang berjalan tidak diubah; perubahan masuk ke sprint berikutnya.", "Pengguna atau wakilnya harus tersedia sepanjang proyek."]}, {"t": "h", "x": "Metode 5: Standard package"}, {"t": "p", "x": "Alternatif lain: **membeli** paket software jadi buatan vendor, misalnya SAP, Oracle, atau MS Project. Awalnya untuk aplikasi umum seperti payroll dan akuntansi; kini tersedia software enterprise menyeluruh. Sangat sesuai bila perusahaan kekurangan tenaga TI atau ingin mengadopsi best practice industri."}, {"t": "table", "head": ["Kelebihan", "Kekurangan"], "rows": [["Biasanya lebih cepat terpasang", "Bergantung pada kelangsungan hidup vendor"], ["Tidak perlu staf pengembang internal", "Jarang menjadi solusi ideal"], ["Umumnya lebih murah", "Sering muncul penolakan untuk mengubah proses bisnis agar cocok dengan software"], ["Vendor bertanggung jawab atas perbaikan dan penyempurnaan", ""], ["Banyak fungsi bisnis memang mirip antarperusahaan dalam satu industri", ""]], "w": [3.4, 3.5]}, {"t": "img", "f": "d4_pilih_metode.png", "cap": "Diagram rangkuman: alur sederhana memilih metode pengembangan"}, {"t": "box", "kind": "contoh", "title": "Satu kampus, tiga metode", "x": ["Sistem keuangan kampus: beli paket (proses akuntansi standar). Sistem registrasi akademik yang aturannya ketat dan menyangkut ribuan mahasiswa: SDLC. Aplikasi mobile info kantin dan bus kampus yang fiturnya masih dicari-cari: agile dengan rilis tiap dua minggu."]}, {"t": "box", "kind": "langkah", "title": "Memilih metode pengembangan", "x": ["Periksa apakah proses bisnisnya umum dan sudah ada paket di pasaran.", "Nilai kejelasan dan kestabilan kebutuhan.", "Nilai ukuran sistem dan besarnya risiko bila gagal.", "Nilai ketersediaan pengguna dan pengalaman tim.", "Pilih metode, lalu tuliskan alasannya agar bisa ditinjau ulang."]}, {"t": "box", "kind": "tips", "title": "Tips", "x": ["Di praktik, metode sering digabung: paket ERP untuk proses inti, agile untuk aplikasi pelengkap di sekelilingnya.", "Saat menilai paket, hitung juga biaya menyesuaikan proses bisnis dan melatih pengguna, bukan hanya harga lisensi."]}, {"t": "h", "x": "Delapan prinsip pengembangan SI"}, {"t": "ol", "x": ["**Libatkan pemilik dan pengguna sistem.** Pemilik memberi arah sesuai kebutuhan perusahaan; pengguna paling paham kebutuhan rinci. Minta persetujuan mereka di tiap langkah.", "**Gunakan pendekatan pemecahan masalah.** Pahami masalah dan konteksnya, tetapkan kriteria solusi, identifikasi alternatif dan pilih yang terbaik, desain dan implementasikan, evaluasi dampaknya. Melompati langkah berisiko memecahkan masalah yang salah.", "**Tetapkan tahapan.** Pekerjaan besar dipecah menjadi aktivitas kecil yang mudah dikelola, berurutan dari atas ke bawah.", "**Tetapkan standar pengembangan dan dokumentasi.** Mencakup aktivitas, tanggung jawab, kebutuhan dokumentasi, dan pemeriksaan mutu.", "**Justifikasi sistem sebagai investasi.** Ada beberapa alternatif solusi; nilai kelayakan dan cost-effectiveness tiap alternatif dengan analisis biaya-manfaat.", "**Jangan takut membatalkan atau mengubah lingkup.** Pendekatan creeping commitment: pasang titik periksa kelayakan; pada tiap titik, biaya yang sudah keluar dianggap sunk cost. Hasilnya: batalkan, evaluasi ulang biaya dan jadwal, atau kurangi lingkup.", "**Bagi dan tundukkan.** Setiap sistem adalah bagian dari supersistem dan terdiri dari subsistem. Pecah masalah besar menjadi potongan yang mudah diselesaikan.", "**Rancang untuk pertumbuhan dan perubahan.** Sistem secara alami menurun (entropy) dan bisa usang. Fleksibilitas harus sengaja dirancang."]}, {"t": "box", "kind": "contoh", "title": "Sunk cost dalam proyek", "x": ["Proyek sudah menghabiskan Rp800 juta dari anggaran Rp1 miliar, tetapi evaluasi menunjukkan butuh Rp900 juta lagi dan manfaatnya hanya Rp500 juta. Rp800 juta itu sudah hangus apa pun keputusannya. Yang dibandingkan hanya biaya ke depan (Rp900 juta) dan manfaat ke depan (Rp500 juta), jadi proyek sebaiknya dihentikan atau lingkupnya dikurangi."]}, {"t": "box", "kind": "latihan", "title": "Pilih metodenya", "x": ["Tentukan metode untuk tiga kasus: UMKM butuh aplikasi kasir; bank mengganti core system; startup membuat aplikasi baru. Bela tiap pilihan dengan minimal dua baris dari tabel perbandingan. Ingat, tidak ada metode terbaik untuk semua situasi."]}], "karier": {"intro": "Pertanyaan \"pernah bekerja dengan Scrum atau waterfall?\" hampir selalu muncul di wawancara posisi yang terkait produk digital dan proyek. Memahami kapan memakai tiap metode membedakan kalian dari orang yang hanya hafal istilah.", "peran": [["Product manager / product owner", "Mengelola backlog, menentukan prioritas fitur tiap sprint, berbicara dengan pengguna"], ["Scrum master / project manager", "Memfasilitasi sprint, atau mengelola proyek waterfall dengan gate review"], ["Konsultan implementasi ERP", "Menjalankan proyek standard package: fit-gap analysis, konfigurasi, pelatihan"], ["System analyst", "Menjembatani kebutuhan pengguna dan tim pengembang pada metode apa pun"], ["Continuous improvement / quality engineer", "Menerapkan logika CMM: proses yang terdefinisi dan terukur menghasilkan mutu lebih baik"]], "skill": ["Scrum dan Kanban (sertifikasi seperti PSM atau CSM sering diminta)", "Analisis biaya-manfaat dan studi kelayakan", "Menulis dokumentasi yang cukup, tidak berlebihan"]}, "kunci": [["SDLC", "Siklus pengembangan sistem bertahap: rencana, analisis, desain, implementasi, support"], ["Waterfall", "Sebutan lain SDLC klasik yang berurutan"], ["Prototyping", "Membuat model kerja untuk dicoba dan diperbaiki berulang"], ["RAD", "Pengembangan cepat lewat prototipe iteratif dan workshop intensif"], ["Agile", "Pengembangan adaptif, iteratif, berorientasi manusia"], ["Sprint", "Satu iterasi pendek pada agile"], ["MVP", "Minimum viable product"], ["Standard package", "Software jadi dari vendor"], ["CMM", "Model lima level kematangan proses pengembangan"], ["Creeping commitment", "Kelayakan proyek dievaluasi ulang di tiap titik periksa"], ["Entropy", "Kecenderungan alami sistem untuk menurun dan usang"]], "kuis": [["Apa beda system analysis dan system design?", "Analysis menentukan APA yang harus dilakukan sistem; design menentukan BAGAIMANA sistem diwujudkan."], ["Sebutkan lima level CMM.", "Initial, Repeatable, Defined, Managed, Optimizing."], ["Mengapa SDLC kurang cocok untuk proyek kecil?", "Boros sumber daya, tidak fleksibel, dan sulit mengikuti perubahan yang cepat."], ["Sebutkan empat nilai Manifesto Agile.", "Individu dan interaksi; software yang bekerja; kolaborasi dengan pelanggan; tanggap terhadap perubahan (masing-masing di atas proses/alat, dokumentasi, kontrak, rencana)."], ["Kapan standard package menjadi pilihan tepat?", "Bila proses bisnisnya umum, perusahaan kekurangan tenaga TI, atau ingin mengadopsi best practice industri."], ["Apa maksud creeping commitment?", "Komitmen proyek ditinjau bertahap di titik periksa; biaya lalu dianggap sunk cost dan proyek bisa dibatalkan, dijadwal ulang, atau dikurangi lingkupnya."]]}, {"id": "m5", "no": 5, "minggu": "Minggu 4", "judul": "Requirements Determination", "sumber": "4-Requirements-Determination.pdf (55 slide)", "ringkas": "Tahap analisis: menentukan apa yang harus dilakukan sistem baru, jenis-jenis requirement, dan teknik menggalinya (wawancara, JAD, kuesioner, dokumen, observasi).", "tujuan": ["Menjelaskan tahap analisis dalam SDLC dan keluarannya", "Mengklasifikasi requirement: business, user, functional, nonfunctional", "Memakai kerangka PIECES", "Menerapkan teknik elisitasi: wawancara, JAD, kuesioner, analisis dokumen, observasi", "Memilih dan menggabungkan teknik yang sesuai"], "blocks": [{"t": "h", "x": "Tahap analisis"}, {"t": "p", "x": "Analisis berarti memecah keseluruhan menjadi bagian-bagian untuk memahami sifat, fungsi, dan hubungan antarbagian. Masukannya adalah hasil tahap perencanaan. Tujuannya pemahaman yang jelas tentang kebutuhan sistem baru, melalui tiga langkah: memahami sistem **as-is**, mengidentifikasi perbaikan, dan mendefinisikan kebutuhan sistem **to-be**."}, {"t": "p", "x": "Keluaran akhirnya adalah **system proposal**: dokumen berisi requirements definition, use case, model proses, dan model data, ditambah analisis kelayakan dan rencana kerja yang direvisi. Proposal dipresentasikan ke komite persetujuan lewat system walk-through. Sebelum masuk desain, nilai bisnis proyek ditinjau ulang."}, {"t": "img", "f": "d5_asis_tobe.png", "cap": "Diagram rangkuman: tiga langkah analisis dan keluarannya"}, {"t": "img", "f": "s5_p07.jpg", "cap": "Slide kuliah hlm. 7: isi system proposal"}, {"t": "h", "x": "Apa itu requirement"}, {"t": "p", "x": "Requirement adalah pernyataan tentang **apa yang harus dilakukan sistem** atau **karakteristik yang harus dimiliki sistem**. Requirements determination mengubah pernyataan kebutuhan bisnis yang masih umum menjadi daftar rinci dan tepat. Standar ISO/IEC/IEEE 29148:2018 menyebut empat dokumen keluaran: BRS (bisnis), StRS (stakeholder), **SyRS (sistem, fokus kuliah ini)**, dan SRS (software)."}, {"t": "table", "head": ["Jenis", "Menjawab", "Contoh dari slide"], "rows": [["Business requirement", "Apa yang dibutuhkan bisnis; alasan proyek diusulkan. Menjadi ukuran sukses di akhir proyek", "\"Menyediakan pencarian produk\", \"memberi akses rekening bagi pelanggan mobile\""], ["User requirement", "Apa yang perlu dilakukan pengguna untuk menyelesaikan tugasnya", "Tugas-tugas pengguna yang menjadi bagian operasi bisnis"], ["Functional requirement", "Proses yang harus dijalankan sistem dan informasi yang harus disediakan/disimpan", "\"Sistem memeriksa pesanan masuk terhadap ketersediaan stok\""], ["Nonfunctional requirement", "Sifat perilaku sistem: operasional, kinerja, keamanan, budaya dan politik", "\"Sistem berjalan di perangkat Android\", \"respons di bawah 2 detik\""], ["System requirement", "Cara sistem dibangun; sudut pandang pengembang, muncul pada tahap desain", "Tidak dibahas rinci di kuliah ini"]], "w": [1.7, 2.7, 2.5]}, {"t": "img", "f": "d5_jenis_requirement.png", "cap": "Diagram rangkuman: empat jenis requirement pada aplikasi pre-order kantin"}, {"t": "table", "head": ["Nonfungsional", "Isi", "Contoh"], "rows": [["Operasional", "Lingkungan fisik dan teknis tempat sistem beroperasi", "Berjalan di browser apa pun; terintegrasi dengan sistem stok yang ada"], ["Kinerja", "Kecepatan, kapasitas, keandalan", "Tersedia 24 jam; mendukung 300 pengguna serentak"], ["Keamanan", "Siapa boleh mengakses dan dalam kondisi apa", "Hanya manajer langsung yang boleh melihat data karyawan"], ["Budaya dan politik", "Faktor budaya, politik, hukum", "Mendukung beberapa mata uang; mematuhi aturan perlindungan data pribadi"]], "w": [1.5, 2.6, 2.8]}, {"t": "img", "f": "s5_p20.jpg", "cap": "Slide kuliah hlm. 20: rincian nonfunctional requirement"}, {"t": "box", "kind": "awas", "title": "Kesalahan klasik mahasiswa", "x": ["Menulis requirement yang tidak bisa diuji, misalnya \"sistem harus cepat dan mudah digunakan\". Perbaiki menjadi terukur: \"pencarian menampilkan hasil dalam 2 detik\" atau \"pengguna baru bisa menyelesaikan pesanan pertama tanpa pelatihan dalam 3 menit\"."]}, {"t": "box", "kind": "langkah", "title": "Menulis requirement", "x": ["Mulai dari business requirement: tujuan bisnis yang ingin dicapai.", "Turunkan user requirement: tugas apa yang harus bisa dilakukan tiap jenis pengguna.", "Turunkan functional requirement: untuk tiap tugas, proses dan informasi apa yang disediakan sistem.", "Tambahkan nonfunctional requirement: operasional, kinerja, keamanan, budaya/politik.", "Beri nomor (1, 1.1, 1.2) dan kelompokkan per fungsi.", "Tinjau bersama pengguna dan minta persetujuan."]}, {"t": "box", "kind": "aturan", "title": "Aturan requirement yang baik", "x": ["Satu kalimat, satu kebutuhan.", "Bisa diuji: ada angka, batas, atau kondisi yang jelas.", "Menyatakan apa, bukan bagaimana (belum menyebut teknologi).", "Tidak ambigu: hindari kata cepat, mudah, fleksibel tanpa ukuran.", "Bisa ditelusuri ke kebutuhan bisnis yang melahirkannya."]}, {"t": "box", "kind": "tips", "title": "Tips", "x": ["Pakai pola kalimat: \"Sistem harus [kata kerja] [objek] [kondisi/ukuran]\".", "Jika sulit menentukan fungsional atau nonfungsional, tanyakan: ini hal yang dilakukan sistem, atau sifat dari cara sistem melakukannya?"]}, {"t": "h", "x": "Diagram konteks dan requirements definition"}, {"t": "p", "x": "Diagram konteks menggambarkan sistem sebagai **kotak hitam**. Pihak di sekelilingnya adalah orang, organisasi, dan sistem lain yang berinteraksi dengan sistem; pada use case mereka disebut **aktor**. Dari diagram konteks kita bisa menemukan use case."}, {"t": "img", "f": "s5_p16.jpg", "cap": "Slide kuliah hlm. 16: diagram konteks"}, {"t": "p", "x": "**Requirements definition statement** punya tiga guna: menyatakan dengan jelas apa yang harus dilakukan sistem, **menetapkan lingkup sistem**, dan membentuk ekspektasi pengguna. Bila ada salah paham di kemudian hari, dokumen inilah rujukannya."}, {"t": "h", "x": "Kerangka PIECES"}, {"t": "table", "head": ["Huruf", "Kebutuhan memperbaiki", "Pertanyaan pemandu"], "rows": [["P  Performance", "Kinerja", "Berapa throughput dan waktu respons yang dapat diterima?"], ["I  Information", "Informasi dan data", "Masukan dan keluaran apa yang perlu, kapan? Data apa yang disimpan? Seberapa mutakhir?"], ["E  Economics", "Ekonomi, biaya, laba", "Biaya mana yang harus turun? Berapa batas anggaran?"], ["C  Control", "Kendali dan keamanan", "Perlukah akses dibatasi? Apa kebutuhan privasi dan cadangan data?"], ["E  Efficiency", "Efisiensi orang dan proses", "Adakah langkah ganda yang bisa dihapus? Adakah pemborosan sumber daya?"], ["S  Service", "Layanan ke pelanggan, pemasok, karyawan", "Siapa penggunanya dan di mana? Pelatihan, dokumentasi, keandalan apa yang dibutuhkan?"]], "w": [1.5, 2.0, 3.4]}, {"t": "box", "kind": "contoh", "title": "PIECES pada antrean puskesmas", "x": ["P: pasien menunggu 2 jam. I: rekam medis kertas sering tidak ketemu. E: lembur petugas tiap hari. C: siapa pun bisa membuka map pasien. E: data pasien ditulis ulang di tiga loket. S: pasien tidak tahu nomor antreannya sudah dekat atau belum. Tiap huruf langsung menjadi bahan requirement."]}, {"t": "img", "f": "s5_p21.jpg", "cap": "Slide kuliah hlm. 21: kerangka PIECES"}, {"t": "box", "kind": "langkah", "title": "Memakai PIECES", "x": ["Amati atau wawancarai proses yang berjalan.", "Untuk tiap huruf, tulis masalah yang ditemukan beserta buktinya (angka, contoh kejadian).", "Cari akar penyebab tiap masalah.", "Ubah tiap masalah menjadi requirement sistem baru.", "Urutkan berdasarkan dampak terhadap tujuan bisnis."]}, {"t": "h", "x": "Teknik elisitasi"}, {"t": "p", "x": "Teknik pengumpulan fakta yang umum: sampling dokumen, formulir, dan basis data yang ada; riset dan kunjungan; observasi lingkungan kerja; kuesioner; wawancara; prototyping; JAD. Efek samping penting dari proses ini: membangun dukungan politik untuk proyek dan kepercayaan antara tim dan pengguna. Libatkan semua pemangku kepentingan kunci dan hargai waktu mereka."}, {"t": "p", "x": "**Wawancara** adalah teknik yang paling sering dipakai. Lima langkahnya:"}, {"t": "ol", "x": ["**Memilih narasumber**: dari berbagai tingkat (manajer, pengguna, pemangku kepentingan lain). Prosesnya iteratif; daftar narasumber biasanya bertambah 50-75%.", "**Merancang pertanyaan**: tertutup (jawaban spesifik), terbuka (penjelasan), probing (menggali lebih dalam). Wawancara tidak terstruktur memakai pertanyaan terbuka; terstruktur lebih banyak pertanyaan tertutup. Urutan bisa **top-down** (umum ke khusus) atau **bottom-up** (khusus ke umum).", "**Menyiapkan wawancara**: susun rencana dan urutan pertanyaan, antisipasi jawaban, tetapkan prioritas bila waktu sempit, beri tahu narasumber jadwal, alasan, dan topik.", "**Melaksanakan**: profesional dan tidak memihak, catat semuanya, tanyakan yang belum paham, pisahkan fakta dari opini, beri narasumber waktu bertanya, jelaskan langkah selanjutnya.", "**Tindak lanjut**: buat laporan wawancara, kirim ke narasumber untuk klarifikasi. Jangan menyebarkan informasi seseorang tanpa izin."]}, {"t": "img", "f": "s5_p32.jpg", "cap": "Slide kuliah hlm. 32: pendekatan top-down dan bottom-up dalam menyusun pertanyaan"}, {"t": "box", "kind": "contoh", "title": "Tiga jenis pertanyaan", "x": ["Tertutup: \"Berapa pesanan yang masuk per hari?\" Terbuka: \"Apa kesulitan terbesar saat memproses pesanan?\" Probing: \"Bisa beri contoh kejadian terakhir? Mengapa itu terjadi?\""]}, {"t": "p", "x": "**Discovery prototyping**: membangun model kecil dari kebutuhan pengguna untuk menemukan atau memverifikasi kebutuhan. Prototipe ini biasanya dibuang dan dibuat dengan teknologi yang berbeda dari sistem akhir."}, {"t": "p", "x": "**JAD (Joint Application Development)**: teknik terstruktur di mana tim proyek, pengguna, dan manajemen bekerja bersama mengidentifikasi kebutuhan. Melibatkan 10-20 pengguna, dipandu **fasilitator** yang netral dan ahli proses kelompok serta analisis sistem, dibantu satu atau dua **scribe**. JAD dapat mengurangi scope creep sampai 50%. **e-JAD** memakai groupware agar peserta bisa menyumbang ide secara anonim, mengatasi dominasi dan rasa sungkan, dan memangkas waktu sesi 50-80%. Sesi JAD selalu terstruktur, jarang memakai pertanyaan tertutup, sebaiknya top-down, dan diakhiri laporan pasca-sesi dalam satu sampai dua minggu."}, {"t": "img", "f": "s5_p39.jpg", "cap": "Slide kuliah hlm. 39: tata ruang pertemuan JAD"}, {"t": "box", "kind": "langkah", "title": "Menjalankan sesi JAD", "x": ["Pilih peserta dari berbagai tingkat dan tunjuk fasilitator yang netral.", "Susun agenda dan daftar pertanyaan; bagikan sebelum sesi.", "Minta peserta membawa dokumen dan contoh kasus.", "Jalankan sesi dengan aturan dasar: satu orang bicara, hargai pendapat, ikuti jadwal.", "Scribe mencatat di layar yang terlihat semua peserta.", "Kirim laporan pasca-sesi dalam 1-2 minggu untuk dikonfirmasi."]}, {"t": "box", "kind": "aturan", "title": "Aturan wawancara", "x": ["Datang dengan rencana pertanyaan, tetapi beri ruang untuk hal di luar rencana.", "Catat semua, pisahkan fakta dari opini.", "Jangan takut bertanya hal yang terdengar sepele.", "Jangan menyebarkan informasi narasumber tanpa izin."]}, {"t": "h", "x": "Memilih teknik"}, {"t": "table", "head": ["", "Wawancara", "JAD", "Kuesioner", "Analisis dokumen", "Observasi"], "rows": [["Jenis informasi", "As-is, perbaikan, to-be", "As-is, perbaikan, to-be", "As-is, perbaikan", "As-is", "As-is"], ["Kedalaman", "Tinggi", "Tinggi", "Sedang", "Rendah", "Rendah"], ["Keluasan", "Rendah", "Sedang", "Tinggi", "Tinggi", "Rendah"], ["Integrasi informasi", "Rendah", "Tinggi", "Rendah", "Rendah", "Rendah"], ["Keterlibatan pengguna", "Sedang", "Tinggi", "Rendah", "Rendah", "Rendah"], ["Biaya", "Sedang", "Rendah-sedang", "Rendah", "Rendah", "Rendah-sedang"]], "w": [1.5, 1.1, 1.1, 1.0, 1.2, 1.0]}, {"t": "p", "x": "Tidak ada satu teknik yang unggul di semua baris, sehingga teknik digabung. Tabel di atas mengikuti perbandingan pada slide (Dennis, Wixom, & Roth, 2019)."}, {"t": "box", "kind": "contoh", "title": "Kasus DronTeq di slide", "x": ["Tim proyek sistem Client Services memulai dengan analisis dokumen (formulir penjualan, tangkapan layar, dokumentasi sistem Sales yang ada), lalu mewawancarai analis senior sistem Sales, kemudian menjalankan tiga sesi JAD dalam seminggu. Karena proses bisnisnya baru, desain JAD memakai informal benchmarking, outcome analysis, dan technology analysis. Hasilnya requirements definition dan system proposal."]}, {"t": "box", "kind": "latihan", "title": "Simulasi wawancara", "x": ["Ajak satu teman berperan sebagai pemilik warung yang punya masalah tersembunyi. Kamu analisnya, waktumu 7 menit, dan wajib memakai minimal satu pertanyaan terbuka, satu tertutup, dan satu probing. Setelah itu tulis tiga functional dan dua nonfunctional requirement, lalu periksa mana yang belum terukur."]}], "karier": {"intro": "Ini pekerjaan harian business analyst dan system analyst. Banyak proyek gagal bukan di coding, tetapi karena kebutuhan salah ditangkap. Kemampuan bertanya dengan benar dan menulis requirement yang bisa diuji adalah keterampilan yang paling cepat terlihat nilainya di tempat kerja.", "peran": [["Business analyst", "Wawancara stakeholder, workshop kebutuhan, menulis BRD/PRD dan user story"], ["UX researcher", "Observasi dan wawancara pengguna, discovery prototyping"], ["Konsultan ERP fungsional", "Workshop fit-gap (mirip JAD) untuk memetakan kebutuhan klien ke fitur paket"], ["Product owner", "Mengubah kebutuhan bisnis menjadi backlog dan kriteria penerimaan"], ["Industrial engineer / process improvement", "Memakai PIECES dan as-is/to-be saat memperbaiki proses, dengan atau tanpa sistem"]], "skill": ["Teknik wawancara dan fasilitasi workshop", "Menulis requirement yang spesifik, terukur, dan bisa diuji", "Analisis stakeholder dan manajemen ekspektasi"]}, "kunci": [["As-is / to-be", "Kondisi sistem saat ini / kondisi sistem yang diinginkan"], ["System proposal", "Keluaran akhir tahap analisis"], ["Functional requirement", "Apa yang harus dilakukan sistem"], ["Nonfunctional requirement", "Sifat yang harus dimiliki sistem"], ["PIECES", "Performance, Information, Economics, Control, Efficiency, Service"], ["Elisitasi", "Proses menggali kebutuhan dari pemangku kepentingan"], ["JAD", "Sesi terstruktur pengguna, manajemen, dan tim proyek dipandu fasilitator"], ["Scope creep", "Lingkup proyek yang terus melebar"], ["Probing question", "Pertanyaan lanjutan untuk menggali lebih dalam"], ["Diagram konteks", "Gambar sistem sebagai kotak hitam dengan pihak luar di sekelilingnya"]], "kuis": [["Sebutkan tiga langkah dasar tahap analisis.", "Memahami sistem as-is, mengidentifikasi perbaikan, mendefinisikan kebutuhan sistem to-be."], ["\"Sistem harus mengenkripsi data pembayaran\" termasuk requirement jenis apa?", "Nonfunctional requirement, kategori keamanan."], ["Apa kepanjangan PIECES?", "Performance, Information, Economics, Control (and security), Efficiency, Service."], ["Apa peran fasilitator JAD?", "Menetapkan agenda dan memandu diskusi, menjaga sesi sesuai jalur, membantu menjelaskan istilah teknis, mencatat masukan di tempat yang terlihat semua; ia netral dan tidak ikut berpendapat."], ["Teknik mana yang paling baik untuk keluasan informasi dengan biaya rendah?", "Kuesioner (dan analisis dokumen)."], ["Mengapa teknik elisitasi perlu digabung?", "Tiap teknik punya kekuatan dan kelemahan berbeda pada kedalaman, keluasan, integrasi, keterlibatan pengguna, dan biaya."]]}, {"id": "m6", "no": 6, "minggu": "Minggu 5-6", "judul": "Pemodelan Proses (DFD)", "sumber": "5-Pemodelan-Proses.pdf (23 slide) dan 6---Pemodelan-Proses-Latihan.pdf (5 slide)", "ringkas": "Menggambar apa yang dikerjakan sistem: diagram dekomposisi, diagram konteks, dan DFD level 0 sampai 3, lengkap dengan pembahasan latihan retail fashion.", "tujuan": ["Menjelaskan model-dr
